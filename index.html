  const it = G.items[G.i], ok = k === it[1]; if (ok) G.ok++; else G.miss.push(it);
  $$('[data-k]').forEach(b => { b.disabled = true; const i = +b.dataset.k; if (i === it[1]) b.classList.add('ok'); else if (i === k) b.classList.add('bad'); });
  $('#gfb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="t">${ok ? 'Isso mesmo!' : 'Era: ' + G.g.cats[it[1]]}</b>${it[2] || ''}</div><button class="btn acc" id="gnext">${G.i === G.items.length - 1 ? 'Ver resultado' : 'Próximo (Enter)'}</button>`;
  $('#gnext').onclick = () => { G.i++; gameRender(); }; $('#gnext').focus();
}
function gameEnd() {
  kb = null; const g = G.g, t = G.items.length, b = S.games[g.id];
  S.games[g.id] = { best: Math.max(G.ok, b ? b.best : 0), total: t }; save();
  app(`<div class="kicker">${g.titulo}</div><h2>${G.ok} de ${t}</h2>
  <div class="card"><div class="score">${Math.round(G.ok / t * 100)}%</div>
  <button class="btn acc" id="re">Jogar de novo</button><a class="btn ghost" href="#/jogos">Outros jogos</a></div>
  ${G.miss.length ? `<h3>O que você errou</h3><div class="card review">${G.miss.map(m => `<div class="item"><p>${m[0]}</p><p><span class="chip ok">${g.cats[m[1]]}</span> <span class="muted">${m[2] || ''}</span></p></div>`).join('')}</div>` : '<div class="card"><b>Perfeito!</b></div>'}`);
  $('#re').onclick = () => gameStart(g);
}

/* ======================= SIMULADO ======================= */
let SM = null;
const SIM_DIST = { 1: 1, 2: 2, 7: 2, 9: 1, 10: 2, 12: 2 };
function simulado() {
  const hist = S.sims.slice(-5).reverse();
  app(`<div class="kicker">Simulado</div><h2>Teste final: 10 questões objetivas</h2>
  <p class="sub">Dez questões sorteadas dos seis capítulos, valendo 4,0 pontos cada (total 40), como a parte objetiva da prova. As respostas só aparecem quando você entregar.</p>
  <div class="card"><button class="btn acc" id="go">Iniciar simulado</button>
  <p class="muted" style="margin:12px 0 0">Dica: faça sem consultar o material e cronometrado. Depois, estude os erros.</p></div>
  ${hist.length ? `<h3>Últimos simulados</h3><div class="card">${hist.map(h => `<div class="row between" style="padding:4px 0"><span>${new Date(h.ts).toLocaleString('pt-BR')}</span><b>${fmt(h.score)} / 40</b></div>`).join('')}</div>` : ''}
  <div class="card"><b>Quer treinar a parte discursiva?</b> <a href="#/discursivas">Vá às discursivas</a> e use os critérios para se autoavaliar.</div>`);
  $('#go').onclick = simStart;
}
function simStart() {
  let list = [];
  Object.keys(SIM_DIST).forEach(k => { list.push(...shuffle(QUIZ.filter(q => q.c == k)).slice(0, SIM_DIST[k])); });
  list = shuffle(list); list.forEach(mkOpts);
  SM = { list, ans: {}, t0: Date.now() };
  simRender();
}
function simRender() {
  timers.forEach(clearInterval); timers = [];
  app(`<div class="row between"><div class="kicker">Simulado</div><span class="timer" id="tm">00:00</span></div>
  ${SM.list.map((q, n) => `<div class="card" data-q="${n}"><div class="qhead"><b>Questão ${n + 1}</b><span class="chip">4,0 pontos</span></div>${qBody(q)}</div>`).join('')}
  <div class="sticky-actions"><div class="row between card" style="margin:0"><span id="prog" class="muted"></span><button class="btn acc" id="sub">Entregar</button></div></div>`);
  const upd = () => { $('#prog').textContent = `${Object.keys(SM.ans).length} de ${SM.list.length} respondidas`; };
  $$('.card[data-q]').forEach(card => {
    const n = +card.dataset.q;
    $$('.alt', card).forEach(b => b.onclick = () => { SM.ans[n] = +b.dataset.i; $$('.alt', card).forEach(x => x.classList.toggle('sel', x === b)); upd(); });
  });
  upd();
  const tick = () => { const s = Math.floor((Date.now() - SM.t0) / 1000); const el = $('#tm'); if (el) el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  tick(); timers.push(setInterval(tick, 1000));
  $('#sub').onclick = () => {
    const miss = SM.list.length - Object.keys(SM.ans).length;
    if (miss && !confirm(`Você deixou ${miss} questão(ões) em branco. Entregar mesmo assim?`)) return;
    simEnd();
  };
}
function simEnd() {
  timers.forEach(clearInterval); timers = [];
  const secs = Math.floor((Date.now() - SM.t0) / 1000);
  let hits = 0; const byCap = {};
  SM.list.forEach((q, n) => {
    const a = SM.ans[n], ok = a != null && q._o[a].ok; if (ok) hits++;
    byCap[q.c] = byCap[q.c] || [0, 0]; byCap[q.c][1]++; if (ok) byCap[q.c][0]++;
    if (a != null) { const p = S.q[q.id] || { n: 0 }; S.q[q.id] = { n: p.n + 1, ok }; }
  });
  const score = hits * 4; S.sims.push({ ts: Date.now(), score, max: 40 }); save(); refreshTotal();
  const weakCaps = Object.keys(byCap).filter(k => byCap[k][0] < byCap[k][1]);
  app(`<div class="kicker">Resultado do simulado</div><h2>${fmt(score)} de 40 pontos</h2>
  <div class="card"><div class="score">${hits}/${SM.list.length}</div><p class="muted">Tempo: ${Math.floor(secs / 60)} min ${secs % 60} s</p>
  <p>${Object.keys(byCap).map(k => `<span class="chip ${byCap[k][0] === byCap[k][1] ? 'ok' : 'warn'}">Cap. ${capById(k).num}: ${byCap[k][0]}/${byCap[k][1]}</span>`).join('')}</p>
  ${weakCaps.length ? `<p><b>Revise:</b> ${weakCaps.map(k => `<a href="#/estudar/${k}">Cap. ${capById(k).num}</a>`).join(', ')}.</p>` : '<p><b>Excelente!</b> Todos os capítulos sem erros.</p>'}
  <button class="btn acc" id="again">Novo simulado</button><a class="btn ghost" href="#/progresso">Ver progresso</a></div>
  <h3>Correção comentada</h3>
  ${SM.list.map((q, n) => { const a = SM.ans[n], ok = a != null && q._o[a].ok; return `<div class="card"><div class="qhead"><b>Questão ${n + 1}</b><span class="chip ${ok ? 'ok' : 'bad'}">${ok ? 'Acertou' : a == null ? 'Em branco' : 'Errou'}</span></div>
  ${q.t ? `<div class="qtext">${esc(q.t)}</div>` : ''}<p class="qenun">${q.q}</p>
  <div class="alts">${q._o.map((o, i) => `<div class="alt ${o.ok ? 'ok' : i === a ? 'bad' : ''}"><span class="l">${LET[i]}</span><span>${o.t}</span></div>`).join('')}</div>
  <div class="fb ${ok ? 'ok' : 'bad'}">${q.e}</div></div>`; }).join('')}`);
  $('#again').onclick = simStart;
}

/* ======================= GLOSSÁRIO ======================= */
let gCap = 'all', gQ = '';
function glossario() {
  const draw = () => {
    const nq = norm(gQ);
    const list = TERMS.filter(t => (gCap === 'all' || t.c == gCap) && (!nq || norm(t.t + ' ' + t.d).includes(nq)));
    $('#gl').innerHTML = list.length ? list.map(t => { const c = capById(t.c); return `<div class="term"><span class="chip c" style="--c:${c.cor}">Cap. ${c.num}</span> <b>${t.t}</b><p style="margin:4px 0 0">${t.d}</p></div>`; }).join('') : '<p class="muted">Nenhum termo encontrado.</p>';
    $('#gcount').textContent = list.length + ' termos';
  };
  app(`<div class="kicker">Glossário</div><h2>Todos os conceitos</h2>
  <p class="sub">Busque um termo ou filtre por capítulo.</p>
  <div class="card"><label class="sr" for="gs">Buscar</label><input type="search" id="gs" placeholder="Buscar: anomia, habitus, uberização…" value="${esc(gQ)}" style="width:100%">
  ${capChips(gCap)}<span class="muted" id="gcount"></span><div id="gl" style="margin-top:8px"></div></div>`);
  $('#gs').oninput = e => { gQ = e.target.value; draw(); };
  $$('[data-cap]').forEach(b => b.onclick = () => { gCap = b.dataset.cap === 'all' ? 'all' : +b.dataset.cap; glossario(); });
  draw();
}

/* ======================= PROGRESSO ======================= */
function progresso() {
  const st = CAPS.map(c => ({ c, s: capStats(c.id) }));
  const totalQ = st.reduce((a, x) => a + x.s.qok, 0), allQ = QUIZ.length;
  app(`<div class="kicker">Progresso</div><h2>Onde você está</h2>
  <div class="card"><div class="stat"><div><b>${pct(overall())}%</b>Preparo geral</div><div><b>${totalQ}/${allQ}</b>Questões acertadas</div><div><b>${st.reduce((a, x) => a + x.s.cok, 0)}/${TERMS.length}</b>Termos dominados</div><div><b>${st.reduce((a, x) => a + x.s.ddone, 0)}/${DISC.length}</b>Discursivas feitas</div></div></div>
  <div class="grid">${st.map(({ c, s }) => `<div class="card" style="--c:${c.cor}"><span class="kicker">Cap. ${c.num}</span><h3 style="margin:2px 0 10px;font-size:18px">${c.titulo}</h3>
  <div class="meta"><span>Leitura</span><div class="bar"><i style="width:${s.read ? 100 : 0}%"></i></div><span>${s.read ? 'lido' : '—'}</span>
  <span>Questões</span><div class="bar"><i style="width:${pct(s.qok / s.qs)}%"></i></div><span>${s.qok}/${s.qs}</span>
  <span>Termos</span><div class="bar"><i style="width:${pct(s.cok / s.ts)}%"></i></div><span>${s.cok}/${s.ts}</span>
  <span>Discursivas</span><div class="bar"><i style="width:${pct(s.dok / s.ds)}%"></i></div><span>${s.dok}/${s.ds}</span></div>
  <p style="margin:12px 0 0"><a href="#/estudar/${c.id}">Estudar</a> · <a href="#/questoes/${c.id}">Questões</a></p></div>`).join('')}</div>
  <p class="muted">“Termos dominados” são flashcards que você acertou várias vezes; “discursivas” contam quando sua autonota é 4,0 ou mais.</p>
  <div class="card"><b>Seus dados ficam apenas neste navegador.</b><br><button class="btn ghost sm" id="reset">Apagar meu progresso</button></div>`);
  $('#reset').onclick = () => { if (confirm('Apagar todo o seu progresso neste navegador? Isso não pode ser desfeito.')) { S = { read: {}, q: {}, cards: {}, disc: {}, games: {}, sims: [], theme: S.theme }; save(); progresso(); refreshTotal(); } };
}

/* ======================= início ======================= */
$('#themebtn').onclick = () => { S.theme = { auto: 'dark', dark: 'light', light: 'auto' }[S.theme] || 'auto'; save(); applyTheme(); };
applyTheme();
route();
})();

</script>
</body>
