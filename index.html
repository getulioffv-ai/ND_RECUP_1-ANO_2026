<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperação de Sociologia</title>
<meta name="description" content="Plataforma interativa de estudo para a prova de recuperação de Sociologia, 1ª série do Ensino Médio.">
<style>
:root{
  --bg:#f5f1e8;--surface:#fffdf8;--surface2:#f0eadb;--ink:#1c2528;--muted:#5a666a;--line:#ddd5c3;
  --accent:#a8421f;--accent-ink:#fff;--ok:#2e7d4f;--okbg:#e2f1e7;--bad:#b3261e;--badbg:#fae4e1;--warn:#8a6a12;--warnbg:#f7edcf;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 18px rgba(40,30,10,.06);
  --display:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131a1c;--surface:#1c2629;--surface2:#243034;--ink:#eee8da;--muted:#a5b1b3;--line:#34444a;
    --accent:#e9855f;--accent-ink:#1a1008;--ok:#7fd1a0;--okbg:#1b3a29;--bad:#ff9d94;--badbg:#472320;--warn:#e6c35c;--warnbg:#3b3317;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131a1c;--surface:#1c2629;--surface2:#243034;--ink:#eee8da;--muted:#a5b1b3;--line:#34444a;
  --accent:#e9855f;--accent-ink:#1a1008;--ok:#7fd1a0;--okbg:#1b3a29;--bad:#ff9d94;--badbg:#472320;--warn:#e6c35c;--warnbg:#3b3317;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);overflow-x:hidden}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);margin-right:auto}
.brand small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand b{font:700 clamp(19px,4.6vw,26px)/1.15 var(--display)}
.pill{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.pill:hover{border-color:var(--ink)}
.total{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.total .bar{width:96px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);font:600 15px var(--body);padding:8px 14px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
nav.tabs a:hover{background:var(--surface2)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{padding-top:22px;padding-bottom:70px;min-height:60vh}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding:18px 0 40px}

/* tipografia */
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
h1{font-size:clamp(28px,6vw,42px);font-weight:800}
h2{font-size:clamp(22px,4.6vw,30px);font-weight:800;margin-bottom:6px}
h3{font-size:20px;font-weight:700;margin:26px 0 8px}
.kicker{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:color-mix(in srgb,var(--c,var(--accent)) 70%,var(--ink))}
.sub{color:var(--muted);margin:2px 0 14px;max-width:70ch}
.muted{color:var(--muted)}
p{margin:0 0 12px}
ul{padding-left:22px;margin:0 0 12px}li{margin:5px 0}

/* cartões e grades */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.grid>.card{margin:0}
.capcard{display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--c);text-decoration:none;color:inherit}
.capcard:hover{transform:translateY(-2px)}
.capcard h3{margin:0;font-size:18px}
.capcard .num{font:800 13px var(--body);letter-spacing:.12em;color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.hero{padding:6px 0 4px}
.hero p{max-width:62ch;color:var(--muted);font-size:18px}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s;margin:14px 0}
.steps a{counter-increment:s;display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 52px;position:relative;text-decoration:none;color:var(--ink)}
.steps a::before{content:counter(s);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.steps a:hover{border-color:var(--ink)}
.steps b{display:block}.steps span{font-size:14px;color:var(--muted)}
.bar{height:9px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));width:0;transition:width .4s}
.meta{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:14px;color:var(--muted)}
.meta .bar{height:7px}
.chip{display:inline-block;font:600 13px var(--body);padding:2px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);margin:2px 4px 2px 0}
.chip.c{background:var(--c);border-color:var(--c);color:#fff}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.chip.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}

/* botões */
.btn{font:700 15px var(--body);background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:99px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;margin:6px 8px 0 0}
.btn:hover{opacity:.9}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
select,input[type=search],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.filters button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* estudar */
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.toc a{font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 10px;border-radius:99px}
.toc a:hover{border-color:var(--ink)}
.minuto{border-left:6px solid var(--c);background:var(--surface)}
.minuto h3{margin-top:0}
.sec{scroll-margin-top:70px}
.sec h3{border-bottom:2px solid var(--c);padding-bottom:5px}
.sec .ex{background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:480px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{background:var(--surface2)}
tbody th{background:var(--surface2);white-space:nowrap}
details.d{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin:8px 0}
details.d summary{cursor:pointer;font-weight:700}

/* flashcards */
.fc{perspective:1000px;margin:16px 0}
.fc button.face{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%;min-height:260px;padding:26px;background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:18px;box-shadow:var(--shadow);font:inherit;color:inherit;cursor:pointer}
.fc .face .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.fc .face .big{font:700 clamp(22px,5vw,32px)/1.25 var(--display)}
.fc .face .def{font-size:clamp(18px,3.6vw,22px);line-height:1.5}
.fc .face .hint{margin-top:14px;font-size:14px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{font:700 15px var(--body);padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.rate .no{border-color:var(--bad);color:var(--bad)}.rate .mid{border-color:var(--warn);color:var(--warn)}.rate .yes{border-color:var(--ok);color:var(--ok)}
.rate button:hover{background:var(--surface2)}

/* questões */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qtext{background:var(--surface2);border-radius:12px;padding:12px 16px;margin:0 0 12px;font-size:16px;white-space:pre-line}
.qenun{font-weight:700;margin:0 0 12px}
.alts{display:grid;gap:8px}
.alt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer}
.alt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font:700 14px var(--body)}
.alt:hover:not(:disabled):not(.sel){border-color:var(--ink)}
.alt:disabled{cursor:default}
.alt.sel{border-color:var(--ink);background:var(--surface2)}
.alt.ok{background:var(--okbg);border-color:var(--ok)}
.alt.ok .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.alt.bad{background:var(--badbg);border-color:var(--bad)}
.alt.bad .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
div.alt{cursor:default}
.fb{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--surface2);border-left:6px solid var(--muted)}
.fb.ok{border-color:var(--ok);background:var(--okbg)}.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b.t{display:block;margin-bottom:2px}
.score{font:800 clamp(38px,9vw,60px)/1 var(--display)}
.review .item{border-top:1px solid var(--line);padding:12px 0}
.review .item:first-child{border-top:0}

/* discursivas */
.disc-list{display:grid;gap:10px}
.disc-item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 16px;text-decoration:none;color:inherit}
.disc-item:hover{border-color:var(--ink);border-left-color:var(--c)}
.counter{font-size:14px;color:var(--muted)}
.kwlist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.crit label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.crit label:first-child{border-top:0}
.crit input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.model{background:var(--okbg);border-left:6px solid var(--ok);border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0}

/* jogos */
.gcard{font:600 clamp(18px,4vw,22px)/1.45 var(--display);padding:22px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:16px;box-shadow:var(--shadow);min-height:110px}
.cats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:12px}
.cats button{font:700 15px var(--body);padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.cats button:hover:not(:disabled){border-color:var(--ink)}
.cats button.ok{background:var(--okbg);border-color:var(--ok)}.cats button.bad{background:var(--badbg);border-color:var(--bad)}
.cats button:disabled{cursor:default}

/* glossário */
.term{border-top:1px solid var(--line);padding:12px 0}
.term:first-child{border-top:0}
.term b{font:700 18px var(--display)}
.stat{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat div{background:var(--surface2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:800 28px var(--display)}
.timer{font:700 16px var(--body);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:50;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);padding:16px 0 10px}
@media (max-width:560px){
  body{font-size:16px}
  .card{padding:15px 15px}
  .total{display:none}
  .rate{gap:6px}
}
@media print{nav.tabs,.top .pill,.btn,.sticky-actions{display:none!important}.card{box-shadow:none}}

</style>
</head>

<footer><div class="wrap">Material baseado nos Capítulos 01, 02, 07, 09, 10 e 12 de Sociologia. Seu progresso é salvo apenas neste navegador. Questões elaboradas para estudo, no estilo da prova.</div></footer>
<script>
/* Conteúdo dos capítulos: resumo por seções, "em 1 minuto" e tabelas comparativas.
   Baseado nos PDFs da pasta (Cap. 01, 02, 07, 09, 10 e 12). */
window.CAPS = [
{
 id: 1, num: "01", cor: "#b4492c",
 titulo: "Introdução ao pensamento sociológico",
 minuto: [
  "A Sociologia nasce das transformações da passagem do feudalismo ao capitalismo e da Revolução Industrial.",
  "Comte cunhou o termo “sociologia” e é o “pai” da disciplina; criou a lei dos três estados (teológico, metafísico e positivo).",
  "O tripé clássico: Marx (conflito de classes), Durkheim (fato social, coesão) e Weber (ação social, sentido).",
  "Revolução Industrial: da manufatura (artesanal) à maquinofatura (máquinas) → salários menores, jornadas de 16 h, trabalho de mulheres e crianças.",
  "Reações operárias: sindicatos (trade unions), ludismo e cartismo.",
  "Três métodos de pesquisa: experimental, de medida e de casos."
 ],
 secoes: [
  { t: "Como nasce a Sociologia", html: `
   <p>A Sociologia surge das transformações iniciadas no século XIV, na passagem da <b>sociedade feudal</b> para a <b>sociedade capitalista</b> (da sociedade medieval para a moderna). As mudanças políticas, sociais e econômicas exigiam um <b>novo pensar</b>, uma teoria geral da sociedade com novos instrumentos de análise.</p>
   <p>O filósofo positivista <b>Auguste Comte</b> foi o impulsionador formal desse pensamento e quem cunhou o termo <i>sociologia</i>, do latim <i>socius</i> (associação) e do grego <i>logos</i> (estudo).</p>
   <p>Como não houve um método unificador de todas as ciências sociais, a Sociologia se dividiu em <b>escolas</b>. Três se destacam: <b>positivismo</b> (Comte e Durkheim), <b>materialismo histórico e dialético</b> (Marx e Engels) e <b>Sociologia compreensiva</b> (Weber).</p>` },
  { t: "A Revolução Industrial", html: `
   <p>A <b>Inglaterra</b> reuniu as condições mínimas para iniciar o processo, e o ponto de partida foi a <b>máquina a vapor</b>. Isso mudou o modo de produzir e as relações de trabalho.</p>
   <ul>
    <li><b>1ª Revolução</b> (séc. XVIII, Inglaterra): máquina a vapor e indústria têxtil.</li>
    <li><b>2ª Revolução</b> (meados do séc. XIX, Europa e EUA): petróleo e indústria automobilística.</li>
    <li><b>3ª Revolução</b> (Japão como novo polo): robótica, eletrônica e informática.</li>
    <li><b>4ª Revolução</b> (globalização; EUA e China): robótica avançada, inteligência artificial, internet das coisas, computação quântica, blockchain, realidade virtual e aumentada.</li>
   </ul>
   <p><b>Manufatura × maquinofatura.</b> Antes, a produção era <b>manufatureira (artesanal)</b>, dependente da habilidade manual. Com as máquinas surgiu a <b>maquinofatura</b>: as máquinas passam a produzir e o trabalhador com habilidade manual deixa de ser necessário. Consequência: <b>redução dos salários</b> e <b>precarização da vida</b>.</p>
   <p>Segundo Hobsbawm, entre 1800 e o fim dos anos 1820 o salário médio dos trabalhadores ingleses foi reduzido em cerca de 5 vezes em relação ao do fim do século anterior (segundo o texto). Passaram a ser regra <b>jornadas de 16 horas</b>, com almoço de no máximo 30 minutos. <b>Mulheres e crianças menores de 10 anos</b> entraram nas fábricas com salários pelo menos 50% menores que os dos homens.</p>
   <p><b>Reações dos trabalhadores:</b> surgiram os <b>sindicatos (<i>trade unions</i>)</b>, que pediam melhores salários e menos horas de trabalho, e dois movimentos:</p>
   <ul>
    <li><b>Ludismo</b>: invasão de fábricas para destruir máquinas (os trabalhadores achavam que elas causavam o desemprego). Foi curto e duramente reprimido pela polícia.</li>
    <li><b>Cartismo</b>: luta por direitos trabalhistas e políticos, como o sufrágio universal masculino e a representação dos trabalhadores no parlamento.</li>
   </ul>
   <p><b>Outras consequências:</b> consolidação do capitalismo, expansão do imperialismo, êxodo rural e urbanização descontrolada, avanços em medicina, transportes e telecomunicações, aumento do consumo (consumismo) e grandes impactos ambientais negativos.</p>` },
  { t: "Darwinismo Social (spencerismo social)", html: `
   <p>Para justificar as transformações do século XIX, surgiu o <b>Darwinismo Social</b>. Ele <b>não tem ligação direta com Charles Darwin</b>: o nome vem da tentativa do inglês <b>Herbert Spencer</b> de aplicar o evolucionismo à sociedade.</p>
   <p>A ideia: sociedades menos adaptadas seriam extintas; haveria <b>hierarquia racial</b> e superioridade de certas sociedades, que teriam a função de governar e legitimar as outras. É uma aplicação enviesada da teoria, porque Darwin falava de <b>espécies, não de sociedades</b>, e jamais criou hierarquias entre espécies. Por isso alguns autores preferem o termo <b>spencerismo social</b>.</p>` },
  { t: "Auguste Comte e o positivismo", html: `
   <p>Comte é considerado o <b>pai da Sociologia</b> por ser o primeiro a enunciar a necessidade de uma ciência capaz de entender as bases da sociedade e por criar propostas de intervenção. Para ele a humanidade passa por <b>três estados</b>:</p>
   <ul>
    <li><b>Teológico</b>: não se explicava a natureza e criaram-se seres sobrenaturais; mitos e religiões eram centrais.</li>
    <li><b>Metafísico</b>: início da Filosofia; teorias racionais para explicar a natureza, mas ainda <b>sem observar a própria natureza</b>.</li>
    <li><b>Positivo</b>: as explicações são buscadas <b>na própria natureza</b>; desenvolvem-se as ciências e a busca pelo progresso (Física, Biologia e Sociologia).</li>
   </ul>
   <p>Em 1847, Comte desenvolveu a <b>Religião da Humanidade</b> (Religião Positiva), que substituiria as demais religiões, consideradas primitivas.</p>
   <p><b>Influência no Brasil:</b> o positivismo foi muito relevante na campanha republicana (Proclamação da República, 15/11/1889). O lema da bandeira, <b>“Ordem e Progresso”</b>, vem de uma frase de Comte: <i>“O amor por princípio e a ordem por base; o progresso por fim.”</i></p>` },
  { t: "Marx e Engels: classes e antagonismo", html: `
   <p>Para <b>Karl Marx e Friedrich Engels</b>, as pessoas devem ser analisadas conforme as <b>condições sociais</b> em que vivem. A ideia de indivíduos isolados só surgiu com o capitalismo e ajuda a aceitar a livre concorrência.</p>
   <ul>
    <li>O <b>proletário</b> vende sua <b>força de trabalho</b>; o <b>burguês</b> a compra. O contrato parece ser entre iguais, mas é só <b>aparência</b>: o vendedor não escolhe onde nem como trabalhar.</li>
    <li>A relação é entre <b>classes</b>: o ponto central é o <b>antagonismo de classes</b> (proletariado × burguesia).</li>
    <li>O <b>Estado</b> cria leis, tribunais e polícia que <b>controlam a luta de classes</b> e evitam o confronto físico.</li>
    <li>Os indivíduos fazem a história, mas dentro de condições estruturantes anteriores; é possível transformá-las. A saída seria a <b>revolução proletária</b>.</li>
    <li>Método: <b>materialismo histórico e dialético</b>. Eles não fizeram trabalho de campo.</li>
   </ul>` },
  { t: "Émile Durkheim: sociedade, fato social e anomia", html: `
   <p>Durkheim desenvolveu um método e <b>foi a campo</b>; por isso introduziu a Sociologia nos <b>currículos acadêmicos</b>.</p>
   <ul>
    <li>A <b>sociedade prevalece sobre o indivíduo</b>. Normas, regras, costumes e leis pairam acima de todos e formam a <b>consciência coletiva</b>, que integra os membros.</li>
    <li>A consciência coletiva se solidifica em <b>instituições</b> (família, sistema judiciário, escola, Estado).</li>
    <li><b>Fato social</b>: maneira de agir, pensar e sentir <b>exterior</b> ao indivíduo, <b>geral</b> na sociedade e com poder de <b>coerção</b>. Deve ser tratado como <b>coisa</b>, afastando prenoções.</li>
    <li>Ênfase em <b>coesão, integração e manutenção</b>. Os conflitos são <b>anomias</b>, causadas pelo <b>enfraquecimento das instituições</b> e das normas integradoras.</li>
   </ul>
   <p class="ex">Exemplo do próprio texto: cada sociedade tem um sistema de educação que se impõe aos indivíduos como “força geralmente irresistível”.</p>` },
  { t: "Max Weber: ação social", html: `
   <p><b>Weber</b> se preocupa com <b>indivíduos e suas ações</b>: por que as pessoas agem assim? A sociedade não é algo externo ou acima das pessoas; é o <b>conjunto das ações de indivíduos</b> que se relacionam. <b>Ação social</b> é a conduta com <b>sentido próprio, orientada para a ação de outros</b>. Um choque casual de dois ciclistas é só um evento; a tentativa de se desviar ou a briga depois são ação social. Por isso sua sociologia é <b>compreensiva</b>: compreende o sentido da ação para explicá-la.</p>
   <p>Os <b>quatro tipos de ação social</b>:</p>
   <ul>
    <li><b>Tradicional</b>: costume arraigado, hábito, tradição familiar, feita quase automaticamente.</li>
    <li><b>Afetiva</b>: movida por sentimentos (prazer, alegria, raiva); importa dar vazão à paixão do momento.</li>
    <li><b>Racional com relação a valores</b>: baseada em convicções (dever, dignidade, piedade), independentemente do resultado.</li>
    <li><b>Racional com relação a fins</b>: a pessoa pesa e mede as consequências e programa o resultado final.</li>
   </ul>
   <p>Weber, ao contrário de Durkheim, vê normas e costumes como algo <b>internalizado</b>, e o indivíduo escolhe a conduta conforme a situação.</p>
   <p><b>Posição política:</b> Durkheim e Weber partem de uma ótica <b>conservadora</b> (não propõem superar o capitalismo); Marx defende a <b>revolução</b>.</p>` },
  { t: "Métodos de investigação", html: `
   <p>A Sociologia tem três métodos básicos de investigação empírica:</p>
   <ul>
    <li><b>Experimental</b>: seleciona temas, observa, coleta dados e organiza evidências para comprovar uma <b>relação causal</b> entre dois fatos. Não nasceu na Sociologia (físicos e biólogos já o usavam).</li>
    <li><b>De medida</b>: surgiu nas Ciências Sociais, na Inglaterra do séc. XIX, com os reformadores sociais. Faz perguntas diretas ou indiretas a <b>populações amplas</b> para análise <b>quantitativa</b>.</li>
    <li><b>De casos</b>: exame <b>intensivo, em amplitude e profundidade</b>, de uma amostra particular (pessoa, grupo, comunidade, instituição, cultura). Quando a unidade é uma comunidade ou sociedade simples, chama-se <b>estudo de campo</b> ou <b>pesquisa etnográfica</b>.</li>
   </ul>` }
 ],
 tabelas: [

    cab: ["", "Marx (e Engels)", "Durkheim", "Weber"],

{
 id: 2, num: "02", cor: "#1f6f6b",
 titulo: "Socialização: do indivíduo à sociedade",
 minuto: [
  "Indivíduo e sociedade compõem “a mesma trama”: não há separação possível entre eles.",
  "A ideia moderna de individualidade é histórica: antes da Modernidade valia o grupo (clã, família, Estado).",
  "Socialização é o processo de aprender, agir e transmitir o que se absorve do meio. Pode ser formal (escola, igreja, Estado) ou informal (família, amigos, trabalho, mídia).",
  "A família é o ponto de partida da socialização informal.",
  "Trabalho socializa: Marx (exploração, mais-valia, alienação), Durkheim (solidariedade mecânica e orgânica) e Weber (disciplina e vocação).",
  "Elias: configuração e interdependência. Habitus: saber social incorporado (Elias; Bourdieu)."
 ],
 secoes: [
  { t: "Indivíduo e sociedade", html: `
   <p>Quem vem primeiro: indivíduos ou sociedade? Resposta do capítulo: <b>indivíduos e sociedade compõem a mesma trama</b>, tecida pelas relações sociais. Os seres humanos só são o que são <b>por viverem em sociedade</b>. Dependemos dos outros para sobreviver, mas isso não anula a liberdade de escolha; a Sociologia discute até que ponto a sociedade nos condiciona.</p>
   <p><b>A individualidade tem história.</b> Antes da Modernidade (povos indígenas das Américas, Grécia e Roma antigas, Idade Média feudal) dava-se pouco valor à pessoa única: a importância estava no <b>grupo</b> (clã, Estado, família).</p>
   <ul>
    <li><b>Séc. XVI</b>: a <b>Reforma Protestante</b> fortalece a ideia de indivíduo (cada pessoa pode se comunicar com Deus sem intermediários).</li>
    <li><b>Séc. XVIII</b>: com o capitalismo consolidado e o pensamento liberal, a ideia de <b>indivíduo e individualismo</b> se estrutura em definitivo; a felicidade passa a ser vista em sua expressão material (propriedade de bens, dinheiro, poder).</li>
    <li><b>Séc. XIX</b>: essa ideia de felicidade e o capitalismo estão plenamente estabelecidos.</li>
   </ul>` },
  { t: "O processo de socialização", html: `
   <p>Ao nascer, tudo já está estabelecido (instituições e relações). A criança vai ampliando seu mundo (familiares, amigos, escola, lugares) e descobre que <b>normas e costumes variam</b> de lugar para lugar. Assim ela vai <b>interiorizando</b> palavras, significados, ideias, valores, crenças e um modo de viver aceito em sua sociedade: isso é a <b>socialização</b>.</p>
   <p>Nascemos, aprendemos, agimos e <b>transmitimos</b> o que absorvemos; mas o que cada um absorve pode ser muito diferente. As <b>desigualdades</b> (condomínio fechado × favela, sertão × metrópole) e as <b>gerações</b> (Baby Boomers × Geração Z) produzem formas distintas de socialização.</p>` },
  { t: "Socialização formal e informal; família; mídia", html: `
   <ul>
    <li><b>Formal</b>: imposta por <b>instituições</b> como igrejas, escolas e Estados.</li>
    <li><b>Informal</b>: ocorre na <b>família</b>, na vizinhança, em grupos de amigos, no trabalho e pela exposição aos <b>meios de comunicação</b>.</li>
   </ul>
   <p>A <b>família</b> é o <b>ponto de partida</b> dos processos informais: espaço privado, de intimidade e afeto, onde aprendemos a obedecer às regras de convivência e a lidar com as diferenças. Já os <b>espaços públicos</b> exigem normas próprias (silêncio na biblioteca, pontualidade na escola e no trabalho).</p>
   <p>Em ambos os espaços, os agentes mais <b>eficazes e persuasivos</b> são os <b>meios de comunicação</b> (cinema, rádio, TV, jornais, telefones, internet, revistas), parte do que se chama “<b>cultura e ideologia</b>”.</p>
   <p class="ex"><b>Leitura (Calligaris, “Os sonhos dos adolescentes”):</b> os jovens “sonham pequeno”; os sonhos dos jovens dependem dos sonhos a que os adultos renunciaram, pois eles buscam nos adultos as aspirações que eles abandonaram. É um exemplo de socialização informal.</p>` },
  { t: "Trabalho como instrumento de socialização", html: `
   <p>O <b>trabalho é a base da produção da existência</b> e do conhecimento. Três leituras sobre ele:</p>
   <ul>
    <li><b>Marx</b>: a divisão social do trabalho cria a divisão de classes. Surgem os donos das máquinas e os que vendem sua força de trabalho. É o <b>antagonismo de classes</b>. Os proprietários pagam menos do que o trabalhador produz e geram o lucro, a <b>mais-valia</b>. A <b>naturalização e a não percepção</b> disso é a <b>alienação</b>, sustentada pela <b>ideologia burguesa</b>.</li>
    <li><b>Durkheim</b>: a produção industrial traz uma <b>solidariedade superior</b>, não conflito. <b>Solidariedade mecânica</b>: sociedades menos complexas, em que cada um sabe fazer quase tudo. <b>Solidariedade orgânica</b>: há divisão do trabalho e as pessoas dependem umas das outras (dentistas, professores, pedreiros...), o que gera <b>coesão social</b>.</li>
    <li><b>Weber</b>: costumes e regras são <b>internalizados</b>. O trabalho é “uma extensão da escola”, modo de impor <b>disciplina aos corpos</b> e padrão de vida do capitalismo e do Estado (a maior instituição, com maior poder de punição e ajustamento de conduta pela força).</li>
   </ul>
   <p>Em resumo: o trabalho pode ser lido como <b>exploração, injustiça e desigualdade</b> (Marx) ou como parte de uma <b>solidariedade que mantém a sociedade coesa</b> (Durkheim).</p>` },
  { t: "Norbert Elias: sociedade dos indivíduos e configuração", html: `
   <p>Para <b>Norbert Elias</b>, a separação entre indivíduo e sociedade é falsa: é só <b>nas relações</b> e por meio delas que as pessoas desenvolvem características humanas (obra <i>A sociedade dos indivíduos</i>). Ele criou o conceito de <b>configuração</b>: conjunto de “eus”, “eles” e “nós” em relações de <b>interdependência</b>.</p>
   <p class="ex">Exemplo: uma partida de futebol. Jogadores, torcidas, árbitros, bandeirinhas e regras formam um fluxo contínuo que só se entende pela configuração. Fora dela não existe o jogo.</p>
   <p>O conceito vale para pequenos grupos ou para uma sociedade inteira, e destaca a <b>interdependência</b> e a <b>unidade</b> entre as pessoas.</p>` },
  { t: "O conceito de habitus", html: `
   <ul>
    <li><b>Elias</b>: habitus é o <b>saber social acumulado</b> ao longo da vida em sociedade, <b>transmitido de geração em geração</b>; muda, mas devagar.</li>
    <li><b>Bourdieu</b> retoma o conceito com o mesmo objetivo (<b>conectar indivíduos e sociedade</b>). Para ele o habitus é <b>social e individual</b> ao mesmo tempo e se aplica a grupo, classe ou indivíduo. Articula as <b>práticas cotidianas</b>, fundindo condições objetivas e subjetivas.</li>
    <li>O habitus é estruturado pelas <b>instituições de socialização</b> (família, escola, Estado) e pelos valores das pessoas; por isso tem forte relação com o <b>lugar que cada pessoa ocupa na sociedade</b>, que é desigual.</li>
   </ul>
   <p class="ex"><b>Leitura (Bourdieu, <i>Razões práticas</i>):</b> habitus são “princípios geradores de práticas distintas e distintivas”: o que o operário come, o esporte que pratica, suas opiniões políticas diferem do empresário industrial; são também esquemas de classificação, de visão e de gosto.</p>` }
 ],
 tabelas: [
  { t: "Socialização: formal × informal",
    cab: ["", "Formal", "Informal"],
    lin: [
     ["Quem realiza", "Instituições estruturadas", "Relações cotidianas e espontâneas"],

     ["Marx", "Exploração, injustiça e desigualdade", "Antagonismo de classes, mais-valia, alienação, ideologia burguesa"],

    ] }
 ]

{
 id: 7, num: "07", cor: "#7a3b69",
 titulo: "Raça e relações raciais sob o olhar da Sociologia",
 minuto: [
  "A Sociologia estuda raça e etnia como construções sociais, em termos de poder, privilégio e status.",
  "Preconceito = atitude negativa por pertencer a um grupo. Discriminação e segregação são comportamentos e práticas que decorrem dele.",
  "O racismo tem relação intrínseca com a escravização e foi construído para justificar a exploração econômica.",
  "Racismo estrutural (Silvio Almeida): resulta de arranjos institucionais e relações de poder; não se reduz a atitudes individuais.",
  "Interseccionalidade: raça, classe e gênero se cruzam e produzem opressões simultâneas.",
  "Munanga: educação ajuda, mas não há fórmulas prontas. É preciso admitir que a sociedade é racista."
 ],
 secoes: [
  { t: "Raça e etnicidade: conceitos", html: `
   <p>A Sociologia examina <b>fatores estruturais e institucionais</b> na formação das relações raciais: raça e etnia em termos de <b>poder e privilégio, recursos econômicos e status social</b>, e como as identidades raciais e étnicas são <b>formadas e negociadas</b>. Assim, pode ajudar a criar políticas equitativas que promovam a diversidade.</p>
   <ul>
    <li><b>Etnicidade</b>: herança <b>biológica ou cultural</b> e características de um indivíduo ou grupo (herança cultural compartilhada ou origem nacional). Também é uma <b>construção social</b>, que emerge das interações entre as pessoas.</li>
    <li><b>Raça</b>: a cor da pele <b>não é categoria biologicamente herdada</b>; marcadores como pigmentação, textura do cabelo e traços identificam as pessoas segundo <b>estereótipos raciais</b>.</li>
    <li><b>Casta social</b> (George Fredrickson): combinação de classe e raça; em sociedades de castas a mobilidade social é praticamente inexistente.</li>
   </ul>` },
  { t: "Diferença e desigualdade", html: `
   <p><b>Desigualdade</b>: situação em que alguém tem vantagem sobre outro por nascimento ou riqueza, com distribuição desigual de recursos, oportunidades e status. Costuma gerar falta de dignidade, injustiça, instabilidade, frustração e hostilidade. <b>Diferença</b> costuma ser vista como algo bom, que gera senso de comunidade, harmonia e cooperação. Há sempre algum nível de desigualdade e diferença; é preciso <b>equilíbrio</b> para uma sociedade saudável.</p>` },
  { t: "Racismo como construção social", html: `
   <p>Estudiosos afirmam que a relação entre <b>racismo e escravização é intrínseca</b>. Pessoas negras foram estigmatizadas como inferiores e submetidas a trabalhos pesados por <b>interesses econômicos</b>: para justificar o poder econômico, o tráfico de escravizados e a exploração, <b>construiu-se a ideia</b> de que a pessoa negra era inferior. O estigma foi consolidado ao longo dos séculos. As vítimas dos colonizadores foram <b>indígenas e negros</b>.</p>
   <p>Segundo o texto, o racismo existe por dois fatores: <b>ignorância</b> (falta de conhecimento sobre outras sociedades e culturas) e <b>pensamento de grupo</b> (ideias e crenças institucionalizadas em grupos que não valorizam o pensamento crítico).</p>
   <p><b>Kabengele Munanga:</b> a educação familiar e escolar pode contribuir fortemente no combate ao racismo, mas <b>ninguém dispõe de fórmulas educativas prontas</b>. A primeira atitude é <b>admitir que nossa sociedade também é racista</b> e perder o medo de ser preconceituoso.</p>` },
  { t: "Branquitude e privilégio branco", html: `
   <p>A <b>branquitude</b> é um sistema de poder que posiciona o branco como norma e foi usado para oprimir pessoas racializadas. O <b>privilégio branco</b> é um conjunto de <b>ganhos imerecidos</b> que acompanham a branquitude: proteção contra discriminação por raça, cor, religião etc., melhores oportunidades de emprego, tratamento “justo” no sistema de justiça criminal, capital cultural, poder político, acesso a educação, moradia e saúde.</p>` },
  { t: "O Brasil: diáspora, desigualdade e violência", html: `
   <p>O Brasil é multicultural, mas a <b>raça continua sendo fator significativo</b>. A diáspora africana no país é a maior do mundo; afrodescendentes são cerca de 20% da população (segundo o texto). Mesmo com essa contribuição histórica e contemporânea, o Brasil tem <b>alto nível de desigualdade</b>, e os afro-brasileiros enfrentam obstáculos maiores para alcançar paridade socioeconômica.</p>
   <p>O assassinato de <b>George Floyd</b> (EUA) gerou protestos mundiais com o lema <b><i>Black Lives Matter</i></b>. No Brasil, a pauta ganhou a mídia com casos de violência policial. Segundo o <b>Atlas da Violência</b>, um jovem negro tem <b>2,6 vezes mais chance</b> de ser morto no Brasil do que um branco. A luta antirracista é pauta-chave contra as desigualdades: “com racismo, não há democracia”.</p>` },
  { t: "Preconceito, discriminação e segregação", html: `
   <ul>
    <li><b>Preconceito</b>: <b>atitude negativa</b> que se tem em relação a alguém por pertencer a um determinado grupo (ideia, sentimento ou juízo formado antes).</li>
    <li><b>Discriminação</b>: <b>tratamento desigual</b> (comportamento) com base na cor, nacionalidade ou religião.</li>
    <li><b>Segregação</b>: <b>separação</b> espacial ou institucional entre grupos.</li>
   </ul>
   <p>Manifestam-se por pensamentos, sentimentos ou comportamentos. As sociedades contêm discriminação positiva (preferência por certos membros) e negativa (contra certos membros). Programas de <b>ação afirmativa</b> adotados em vários países deram novas dimensões ao tema.</p>` },
  { t: "Racismo estrutural", html: `
   <p><b>Racismo estrutural</b> é a forma de discriminação resultante dos <b>arranjos institucionais</b> e das <b>relações de poder</b> na sociedade. Tem efeitos <b>duradouros</b> e perpetua estereótipos negativos.</p>
   <p>Segundo <b>Silvio Almeida</b>, refere-se a práticas que mantêm a <b>supremacia branca</b> por meio de <b>vantagens acidentais (muitas vezes inconscientes)</b> dadas aos brancos, em razão de fenômenos como <b>escravização, colonização</b> e padrões de imigração euro-americanos.</p>
   <p>É um “sistema invisível de regras, instituições e práticas” que favorece certos grupos <b>além da discriminação individual</b>. Manifesta-se em: disparidades no acesso a educação, saúde e oportunidades econômicas; segregação por raça ou etnia; aplicação desigual de leis; ataques diretos, exclusão social, estereotipagem e discriminação habitacional.</p>` },
  { t: "Interseccionalidade", html: `
   <p><b>Interseccionalidade</b>: as maneiras pelas quais diferentes aspectos da identidade de uma pessoa, como <b>raça, classe e gênero</b>, interagem e se cruzam, contribuindo para <b>sistemas de opressão e dominação</b>. Ela ajuda a entender como várias formas de discriminação e desigualdade <b>operam simultaneamente</b> e produzem formas mais intensas de exclusão. Mostra também como privilégio e discriminação operam juntos para criar hierarquias de poder.</p>` }
 ],
 tabelas: [
  { t: "Conceitos-chave de relações raciais",
    cab: ["Conceito", "Ideia central", "Palavra de ordem"],
    lin: [
     ["Preconceito", "Atitude negativa por pertencer a um grupo", "Ideia/atitude"],
     ["Discriminação", "Tratamento desigual", "Comportamento"],
     ["Segregação", "Separação de grupos", "Espaço/instituição"],

    ] }
 ]
},
{
 id: 9, num: "09", cor: "#8a6a12",
 titulo: "O mundo do trabalho e a organização da vida social",
 minuto: [
  "Antigas sociedades: o trabalho não é uma esfera separada, está integrado a rituais, mitos, festas, arte e parentesco.",
  "Grécia e Roma: trabalho escravo e valorização do ócio. Feudalismo: servos e corporações de ofício (mestre, oficial, aprendiz).",
  "Capitalismo: o trabalhador só tem a força de trabalho para vender. Marx: mais-valia e alienação; Weber: ética protestante; Durkheim: solidariedade e anomia.",
  "Fordismo (linha de montagem, produção em massa, 8 h) × Toyotismo (just-in-time, trabalhador flexível e polivalente).",
  "Pós-1970: flexibilização, acumulação flexível (Harvey), desemprego conjuntural vira estrutural.",
  "Hoje: precarização, pejotização e uberização."
 ],
 secoes: [
  { t: "Rede de trabalho e sociedades antigas", html: `
   <p>A sociedade atual envolve uma complexa rede de trabalho (pense em tudo o que existe por trás de um copo de leite). Já as <b>sociedades antigas</b> (termo preferido a “tribais”, que é pejorativo) <b>não são estruturadas pela atividade que chamamos de trabalho</b>: todos fazem quase tudo, e as atividades de subsistência (criação, caça, agricultura, coleta) estão associadas a <b>rituais e mitos, festas, artes e parentesco</b>. A divisão das tarefas ocorre por <b>sexo e idade</b>, e a ideia de “pobreza” associada a esse modo de vida é hoje considerada um <b>preconceito</b>.</p>` },
  { t: "Antiguidade e feudalismo", html: `
   <p><b>Grécia e Roma:</b> acredita-se que “trabalho” venha de <b>tripallium</b>, instrumento de tortura. A produção era garantida pela <b>mão de obra escrava</b>. Os cidadãos (homens, proprietários, maiores de idade, nascidos na cidade) viviam no <b>ócio</b>, dedicados à política e à filosofia; Platão e Aristóteles consideravam a vida “virtuosa” uma vida ociosa.</p>
   <p><b>Feudalismo:</b> servos, camponeses, aldeões e homens livres sustentavam o sistema. Os servos ligados ao trabalho agrícola; também havia comércio e artesanato. Nas cidades, o artesanato se organizava em <b>corporações de ofício</b>, com hierarquia: <b>mestre</b> (topo, controla o trabalho), <b>oficial</b> (intermediário, define jornada e remuneração, transmite os ensinamentos) e <b>aprendiz</b> (12 a 15 anos, subordinado a um mestre).</p>
   <p>Nessas sociedades o trabalho não era o elemento central e era pouco valorizado; a vida social se definia por hereditariedade, honra, religião e lealdade.</p>` },
  { t: "A virada para o capitalismo", html: `
   <p>Ao fim da Idade Média e com o <b>mercantilismo</b>, o trabalho, antes visto como penoso e torturante, passou a ser visto como positivo, porque não era mais possível contar com o serviço compulsório na Europa. Houve um convencimento de que <b>trabalhar para os outros era algo bom</b>.</p>
   <p>Para isso, a estrutura social <b>separou a casa do local de trabalho</b>, depois <b>segregou os trabalhadores de seus instrumentos</b> e por fim retirou deles a possibilidade de obter <b>matéria-prima</b>. Comerciantes e industriais enriquecidos passaram a financiar e coordenar a produção, definindo o que e quanto produzir (lei da oferta e da procura).</p>` },
  { t: "Marx: o trabalho no capitalismo", html: `
   <p>Com as fábricas surgem os <b>donos das máquinas</b>. A passagem da manufatura à maquinofatura revolucionou a produção, mas <b>subordinou o trabalhador às máquinas e aos proprietários</b>; não se exigia muito conhecimento para operá-las. O trabalhador passa a ser dono apenas da sua <b>força de trabalho</b>, a única coisa que tem para vender.</p>
   <p>Marx chama isso de <b>relação entre dois “iguais”</b> (proprietários de mercadorias, comprando e vendendo força de trabalho): um contrato que fixa, por exemplo, 10 h diárias, 60 h semanais. A produção capitalista é essencialmente produção de <b>mais-valia</b>, e o prolongamento da jornada leva ao esgotamento da força de trabalho. O trabalhador <b>não reconhece o produto como seu</b> (alienação): “quanto mais poderoso o trabalho, mais impotente fica o trabalhador”.</p>` },
  { t: "Weber e Durkheim: outros olhares", html: `
   <p><b>Weber</b> (obra <i>A ética protestante e o espírito do capitalismo</i>, 1905): olha o trabalho pela <b>visão religiosa</b>. A <b>Reforma Protestante</b> levou os <b>calvinistas</b> a inverterem a lógica da usura (pecado para os católicos) e a exaltarem o trabalho duro e a <b>acumulação de riqueza</b> a partir dele. É uma <b>vocação</b> (chamado de Deus) fundamental para o <b>espírito capitalista</b>. Hoje a lógica de mercado seria orientada por essa visão: enriquecimento pelo trabalho e <b>mérito</b>.</p>
   <p><b>Durkheim</b>: a crescente <b>especialização do trabalho</b> traz nova forma de <b>solidariedade</b> e <b>não gera conflitos</b>. <b>Mecânica</b>: sociedades menos complexas, todos fazem praticamente tudo; os indivíduos se assemelham. <b>Orgânica</b>: típica da sociedade atual, com grande divisão do trabalho e individualidade; as pessoas dependem muito umas das outras (<b>interdependência das funções sociais</b>). Os conflitos do fim do séc. XIX são questão <b>moral</b> e se explicam pela falta de instituições e normas integradoras, a <b>anomia</b>; se elas existissem, a <b>coesão social</b> prevaleceria.</p>` },
  { t: "Fordismo e toyotismo", html: `
   <p><b>Fordismo</b> (Henry Ford, 1914, <b>linha de montagem</b>): usa o <b>taylorismo</b> (Frederick Taylor: racionalidade e organização do trabalho). Estabeleceu <b>jornada de 8 horas</b>, salário por dia e reduziu o preço do <b>Modelo T</b> a ponto de os operários poderem comprá-lo: nascem a <b>produção e o consumo em massa</b>. Aumentou o <b>controle</b> sobre os trabalhadores (recompensas e punições), com trabalhador especializado em tarefa fixa.</p>
   <p><b>Toyotismo</b> (<i>just-in-time</i>, Japão, anos 1970, Terceira Revolução Industrial): produção <b>conforme a demanda</b>, no tempo certo; matérias-primas na quantidade exata; <b>reduz desperdícios e estoques</b>; valoriza <b>qualidade total</b>; fornecedores próximos formam uma <b>rede de produção</b>; exige <b>mão de obra flexível</b> (polivalente).</p>` },
  { t: "Flexibilização e acumulação flexível", html: `
   <p>Após 1970, a busca por lucro e a <b>crise do petróleo</b> levaram à <b>flexibilização do trabalho e dos mercados</b>. Automação, robótica, eletrônica e informatização reduziram o controle manual: o trabalhador especializado perde importância e passa-se a exigir <b>disponibilidade para se adaptar</b> a várias funções. Os que não se adaptam são demitidos.</p>
   <p>O <b>desemprego conjuntural</b> (antigo “exército de reserva”) torna-se <b>estrutural</b>: não é mais possível garantir emprego formal à maioria, e muitos trabalharão a vida inteira de forma precária, sem aposentadoria. David Harvey chama esse modelo de <b>acumulação flexível</b>, em confronto com a rigidez do fordismo.</p>` },
  { t: "O trabalho no Brasil", html: `
   <p>O trabalho no Brasil não se entende sem a expansão ultramarina e o mercantilismo: sequestro de africanos, <b>escravidão indígena e africana</b>, agricultura, mineração, e a industrialização e urbanização a partir de 1930. A <b>Lei Áurea</b> (1888) encerrou <b>350 anos</b> de trabalho compulsório e não remunerado, sem nenhuma política de reparação. Até 1945 a maioria vivia no campo; hoje, em cidades. Em 2019 (PNAD/IBGE) a minoria trabalhava na agricultura.</p>
   <ul>
    <li><b>Emprego e qualificação</b>: mais escolaridade não garante emprego equivalente.</li>
    <li><b>Trabalho informal</b>: sem registro, condições precárias, sem segurança.</li>
    <li><b>Trabalho infantil</b>: persiste, apesar do ECA.</li>
    <li><b>Escravidão por dívida</b>: persiste (ex.: oficina com bolivianos em Indaiatuba/SP).</li>
   </ul>` },
  { t: "Precarização, pejotização e uberização", html: `
   <p>Nos últimos 40 anos, a acumulação flexível reverteu conquistas do pós-guerra por três fenômenos: <b>transformações tecnológicas</b>, <b>alterações nas regulações sociais</b> e <b>fragilização da organização dos trabalhadores</b>.</p>
   <ul>
    <li><b>Pejotização</b>: exigir que o trabalhador tenha <b>CNPJ</b> para prestar serviço, maquiando a relação de trabalho: reduz direitos e beneficia o empregador.</li>
    <li><b>Uberização</b> (de <i>Uber</i>; também iFood, Mercado Livre, 99): o tempo de trabalho é alienado de forma mais intensa e o trabalhador <b>põe à disposição seus próprios meios (veículo etc.)</b> e arca com os custos, sem proteção. Jornadas tão longas quanto as da Primeira Revolução Industrial.</li>
   </ul>` }
 ],

 secoes: [
  { t: "O poder na Sociologia", html: `
   <p>Desde <b>Max Weber</b>, o <b>poder</b> é a capacidade de <b>controlar pessoas, situações, eventos</b> e o destino de si e dos demais. É uma <b>ação social</b>: os pais têm poder sobre os filhos, mas obedecem a superiores no trabalho, que estão sujeitos às leis dos governantes. Weber propõe três tipos de poder:</p>
   <ul>
    <li><b>Legal</b>: fundado na <b>ordem jurídica</b> (leis, estruturas judiciais, burocracia).</li>
    <li><b>Tradicional</b>: baseado em <b>costumes e hábitos</b> que passam por gerações sem questionamento.</li>
    <li><b>Carismático</b>: baseado no <b>afeto pelo líder</b>, que tem dom da palavra ou poder espiritual, visto como sagrado ou heroico.</li>
   </ul>
   <p>Outros poderes: <b>ideológico</b> (propaganda e comunicação que exaltam um modelo de governança), <b>econômico</b> (quem tem muito mais posses oprime e impõe condições) e <b>político</b> (grupo com monopólio da força militar que controla as instituições). Escolas, religiões e governos sustentam algo maior: o <b>Estado</b>.</p>` },
  { t: "O que é o Estado", html: `
   <p>Estado é a <b>instituição social que detém o poder do Governo e o monopólio do uso da força</b> sobre o povo; também pode ser visto como os limites territoriais de uma nação. <b>Hegel</b> o define como materialização do <b>interesse geral</b> do povo, acima de interesses pessoais. Há Estados desde a Antiguidade (China, Roma, Império Mongol), mas a Sociologia estuda as formas mais recentes. Com o fim do mundo feudal, a partir do séc. XIV os governos <b>centralizaram</b> Forças Armadas, sistema tributário, burocracia e um aparato de convencimento.</p>` },
  { t: "Os pensadores do Estado", html: `
   <ul>
    <li><b>Maquiavel</b> (1469-1527): primeiro filósofo político; entender o Estado <b>como ele é, não como deveria ser</b>. O Estado é exercício de poder e o governante deve fazer o que for preciso para se manter nele.</li>
    <li><b>Jean Bodin</b>: <b>soberania sem limites</b>; poder absoluto que unifica todos em um corpo único, inexistente sem o monarca.</li>
    <li><b>Thomas Hobbes</b>: o <b>Leviatã</b>; “o homem é o lobo do homem”; no estado de natureza o ser humano é mau; só um <b>contrato (pacto) social</b> freia a barbárie e origina um Estado <b>absolutista</b>.</li>
    <li><b>John Locke</b>: teórico da Revolução Gloriosa (1688). Seres humanos livres por natureza; o Estado deve proteger a <b>propriedade</b>, a liberdade de expressão e a livre iniciativa; poder político <b>democrático</b>, em parlamento eleito. Distingue sociedade política (Estado) e sociedade civil.</li>
    <li><b>Montesquieu</b>: <b>divisão do poder em três</b>: Legislativo (propõe leis), Executivo (executa) e Judiciário (fiscaliza).</li>
    <li><b>Rousseau</b>: o ser humano é <b>bom por natureza</b>, mas <b>corrompido pela sociedade</b>; a propriedade privada é o “pecado original”; criticou o absolutismo de Hobbes e o liberalismo de Locke; pessimista quanto à democracia verdadeira.</li>
    <li><b>Benjamin Constant</b>: separação máxima entre Estado e sociedade civil; crítico de Rousseau: a igualdade seria uma intimidação à liberdade.</li>
    <li><b>Hegel</b>: a sociedade civil não existe sem o Estado, que é seu fundamento e alicerce.</li>
   </ul>` },
  { t: "O Estado absolutista", html: `
   <p>Entre os séculos XI e XIV, guerras, revoltas de camponeses, cruzadas e comércio levaram à necessidade de um <b>Estado centralizado</b>, com mercado interno unificado e moeda única; o poder dos monarcas se fortaleceu. O primeiro Estado nacional absolutista foi <b>Portugal</b> (Revolução de Avis, fim do séc. XIV). Depois vieram Inglaterra, Espanha, França etc.</p>
   <ul>
    <li>Funcionários recolhiam <b>impostos</b>; havia <b>exército fiel ao rei</b>; o Estado era <b>monopolista</b> (fixava preços, tarifas e moedas).</li>
    <li>O poder do Estado se confundia com o monarca: <b>Luís XIV</b> (“<i>L’État c’est moi</i>”, “o Estado sou eu”).</li>
    <li>Bossuet: reis como representantes de Deus. Maquiavel e Hobbes defendiam um Estado forte.</li>
    <li>Aliança entre <b>clero, nobreza e burguesia</b>, com poder concentrado no soberano; sem espaço para os menos favorecidos.</li>
    <li>O Estado <b>intervinha fortemente na economia</b> e se expandia com <b>colônias marítimas</b>, enriquecendo a burguesia.</li>
   </ul>` },
  { t: "O Estado liberal", html: `
   <p>No séc. XVII, como reação ao absolutismo, surge o <b>liberalismo</b>: valoriza <b>individualismo, liberdade e propriedade privada</b> e é contrário à participação do Estado na economia. <b>Adam Smith</b>: a <b>livre concorrência</b> e a <b>mão invisível</b> do mercado controlariam a economia. <i>Laissez-faire, laissez-passer</i> (“deixai fazer, deixai passar”).</p>
   <ul>
    <li>Estado <b>laico</b>; atuação na <b>res publica</b> (saúde, estradas, infraestrutura, educação) e na <b>segurança pública</b>, para proteger a propriedade privada.</li>
    <li>Alicerce: <b>soberania popular</b> e fortalecimento do <b>Parlamento</b>.</li>
    <li>Impulsos: <b>Revolução Puritana</b> (1642-49), <b>Revolução Gloriosa</b> (1688) e <b>Revolução Francesa</b> (1789-99).</li>
    <li>Desgaste no fim do séc. XIX: falência e incorporação de pequenas empresas, concentração de renda e disputas por mercados, que ajudaram a levar à Primeira Guerra Mundial.</li>
   </ul>` },
  { t: "O Estado no século XX: soviético, fascista e totalitário", html: `
   <p>No início do séc. XX, ao lado do liberal, surgiram o <b>Estado soviético</b> e o <b>nazista</b>; depois da Segunda Guerra, duas variações do liberal: o <b>de bem-estar social</b> e o <b>neoliberalismo</b>. Houve ainda ditaduras na América Latina e na África.</p>
   <p><b>Soviético:</b> nasce da <b>Revolução Russa (1917)</b>; Estado socialista que propõe o <b>fim da propriedade privada</b> em favor de propriedades coletivas; o <b>Partido Comunista</b> centraliza o poder e reprime opositores. URSS (1922) chegou a 15 repúblicas; em crise em 1985; queda do Muro de Berlim em 1989 e dissolução. Ainda seguem modelo semelhante Cuba, Vietnã, China e Coreia do Norte.</p>
   <p><b>Fascista (nazifascismo):</b> entre as décadas de 1920 e 1940, na <b>Itália (Mussolini)</b> e na <b>Alemanha (Hitler)</b>. Forte <b>nacionalismo</b>, adesão total ao <b>líder supremo</b>, <b>mantém o capitalismo e a propriedade privada</b>; quem não pertence à comunidade (raça, história, ideologia) é inimigo da nação; ordem, obediência e hierarquia militar; uso da força. Ambos chegaram ao poder por <b>vias legais</b> (decisões de parlamentos), não por golpe. Gerou a Segunda Guerra (1939-1945).</p>
   <p><b>Estado totalitário:</b> expressão para ditaduras de partido único (fascistas ou comunistas), com forte concentração de poder, propaganda e violência extrema. Hannah Arendt considera totalitárias só a Alemanha de Hitler (de 1938) e a URSS de Stalin (de 1930); Friedrich e Brzezinski incluem também a Itália fascista, a China comunista e o Leste Europeu. Características: <b>ideologia oficial; partido único dirigido por um ditador; terrorismo policial; monopólio dos meios de comunicação; monopólio da luta armada; controle central da economia</b>.</p>` },
  { t: "Comunismo × fascismo", html: `
   <ul>
    <li><b>Comunismo</b>: transformação total socioeconômica; humanidade vista como boa; ditadura do proletariado <b>temporária</b>; herdeiro do Iluminismo e da Revolução Francesa; apoio no <b>proletariado</b>; sociedade <b>sem classes</b>; <b>estatiza</b> os meios de produção.</li>
    <li><b>Fascismo</b>: contra transformações radicais; essência na <b>raça pura</b> que dominaria os demais; tendências contrarrevolucionárias e nacionalistas; símbolos de poder (fascio romano, suástica, sigma dos integralistas brasileiros); apoio em <b>pequenos burgueses, banqueiros e industriais</b>; supremacia permanente da “raça eleita”; economia na <b>esfera privada</b>.</li>
   </ul>` },
  { t: "Estado de bem-estar social e neoliberal", html: `
   <p><b>Bem-estar social (<i>Welfare State</i>):</b> após a <b>crise de 1929</b> (queda da Bolsa de Nova York), <b>John Maynard Keynes</b> formulou a teoria (<i>Teoria geral do emprego, do juro e da moeda</i>, 1936). Há <b>intervenção estatal na economia</b>: regula, subsidia e constrói obras que geram empregos. Educação, saúde, transporte, lazer, moradia, trabalho e seguro-desemprego. É <b>frontalmente oposto ao liberalismo</b>. Aplicado no pós-guerra nos EUA (<i>New Deal</i>) e na Europa.</p>
   <p><b>Neoliberal:</b> no fim dos anos 1970, <b>Friedrich Hayek</b> e <b>Milton Friedman</b> atribuíram a crise aos <b>gastos sociais</b> dos governos (endividamento, impostos, inflação). Defendem o <b>Estado mínimo</b>, a <b>privatização</b> de serviços (saúde, educação), <b>livre mercado, livre iniciativa, individualismo</b>. Aplicado por <b>Margaret Thatcher</b> (Inglaterra, 1979-1990) e <b>Ronald Reagan</b> (EUA, 1981-1991), com cortes em habitação, assistência social, transporte, saúde, previdência e direitos trabalhistas. Grandes corporações passam a ditar atos do Estado; o poder de consumo separa “vitoriosos” de “fracassados”.</p>` },
  { t: "A formação do Estado brasileiro", html: `
   <ul>
    <li><b>1534</b>: capitanias hereditárias (D. João III). <b>1548</b>: Governo-Geral na Bahia (Salvador), para centralizar. <b>Câmaras Municipais</b> organizam vilas e cidades.</li>
    <li><b>1822</b>: Independência e <b>monarquia constitucional</b> com executivo forte. <b>Constituição de 1824</b> (outorgada): quatro poderes (Executivo, Legislativo, Judiciário e <b>Moderador</b>, exclusivo do imperador, que era “juiz de si mesmo”).</li>
    <li>Parlamentarismo de D. Pedro II = <b>“parlamentarismo às avessas”</b> (o imperador nomeava o primeiro-ministro e podia dissolver a Câmara).</li>
    <li><b>1889</b>: golpe militar, Marechal <b>Deodoro da Fonseca</b>; <b>1891</b>: primeira constituição federativa e presidencialista (modelo dos EUA). Três poderes; Legislativo <b>bicameral</b> (Senado e Câmara).</li>
    <li>Até <b>1930</b>: política do <b>café com leite</b> (oligarquias paulista e mineira) e <b>voto de cabresto</b>.</li>
    <li><b>1930</b>: Revolução e governo <b>Getúlio Vargas</b> (15 anos; trabalhismo, sindicatos, industrialização, propaganda nacionalista). Suicídio em 1954. <b>JK</b> (1956-61, Brasília). <b>Jânio Quadros</b> renuncia (1961); parlamentarismo (1961-63); <b>Jango</b>.</li>
    <li><b>1964</b>: golpe civil-militar e <b>ditadura até 1985</b>: repressão, atos autoritários, “milagre brasileiro” seguido de crise; <b>Diretas Já</b>.</li>
    <li><b>1988</b>: <b>Constituição Cidadã</b>, em vigor até hoje.</li>
   </ul>` }
 ],

 secoes: [
  { t: "Conceituando cultura", html: `
   <p>Do latim, <b>cultura</b> significava cuidar, cultivar e crescer. Um sentido comum é o de <b>erudição e refinamento</b>, mas é um equívoco achar que pessoas e grupos da base da pirâmide social não têm cultura.</p>
   <p><b>Clifford Geertz</b> (1978): a cultura é como <b>teias de aranha</b>, redes de significados em que o ser humano está amarrado, mas que ele mesmo produz. É também uma <b>ação, como a linguagem</b>; o antropólogo faz uma <b>“descrição densa”</b>: visão detalhada e profunda, sem julgar, olhando pelo olhar do outro. A cultura é composta por <b>códigos</b> conhecidos pelos participantes (ainda que de modo implícito) e é dotada de sentido. Não há definição consensual; somos afetados pela cultura, mas podemos <b>transformá-la</b>.</p>` },
  { t: "Antropologia e evolucionismo", html: `
   <p>A Antropologia Cultural surgiu como disciplina acadêmica no <b>séc. XIX, na Europa</b>, no contexto do <b>neocolonialismo</b> (EUA, Inglaterra e França dominando África e Ásia). Inicialmente serviu para compreender os povos a serem dominados.</p>
   <p><b>Evolucionismo</b>: as culturas humanas caminhariam para uma <b>mesma direção</b>, em estágios diferentes; a cultura ocidental estaria no topo. Influenciado por Darwin (<i>A origem das espécies</i>, 1859) e pelo darwinismo social de Spencer, justificava o domínio imperial.</p>
   <ul>
    <li><b>Lewis Henry Morgan</b> (<i>A sociedade antiga</i>): três estágios: <b>selvageria</b> (caçadores e coletores), <b>barbárie</b> (agricultura) e <b>civilização</b> (sociedade urbanizada, com Estado). Estudou parentesco entre os iroqueses.</li>
    <li><b>Edward Tylor</b> (<i>Cultura primitiva</i>): primeira definição sistemática: cultura é “aquele todo complexo que inclui conhecimento, crença, arte, moral, lei, costume e quaisquer outras capacidades e hábitos adquiridos pelo homem como membro da sociedade”. Todos teriam cultura, em graus diferentes.</li>
   </ul>` },
  { t: "Trabalho de campo, Malinowski e Boas", html: `
   <p>A Antropologia divide-se em <b>Física</b> (dimensão biológica) e <b>Cultural</b> (a cultura; próxima da Sociologia). Seu método básico é o <b>trabalho de campo</b>, e o mais usado é a <b>observação participante</b>, estabelecida por <b>Bronislaw Malinowski</b>: o pesquisador não apenas convive, mas faz <b>imersão na cultura</b>, aprendendo a língua, os costumes e os rituais. Para ele, a cultura faz parte da estrutura social e cada esfera tem uma função no sistema.</p>
   <p><b>Franz Boas</b> (alemão, carreira nos EUA) criticou a raça como fator primordial na análise da cultura e acreditava que só existe <b>uma raça humana</b>, com grande diversidade biológica (fenotípica) e cultural. Seus dois princípios:</p>
   <ul>
    <li><b>Particularismo histórico</b>: cada cultura tem valores e história únicos; <b>não existe uma linha única de desenvolvimento</b> (crítica aos evolucionistas). Estuda-se a cultura em seus próprios termos.</li>
    <li><b>Relativismo cultural</b>: ao olhar outra cultura, <b>não há hierarquia</b> entre ela e as demais; todas são ricas e complexas. É um <b>método</b>.</li>
   </ul>` },
  { t: "Cultura e personalidade (Benedict)", html: `
   <p>A <b>Escola de Cultura e Personalidade</b> enfatiza a influência da cultura sobre o comportamento e as relações entre fatores psicológicos (personalidade, emoções) e a esfera cultural. <b>Ruth Benedict</b> (discípula de Boas) pensou a cultura como uma <b>lente</b> pela qual enxergamos o mundo (ex.: a importância do Carnaval para os brasileiros). Conceito-chave: <b><i>ethos</i></b>, conjunto de traços que formam o caráter e a identidade de um grupo (<i>Padrões de cultura</i>: zunhis e kwakiutls). Foi criticado por dar pouca autonomia aos indivíduos; hoje usa-se mais o conceito de <b>identidade</b>.</p>` },
  { t: "Cultura popular e cultura erudita", html: `
   <ul>
    <li><b>Popular</b> (Vannucchi): conhecimentos e práticas vividas pelo povo, ainda que possam ser instrumentalizados pelas elites; mais <b>espontânea e livre</b> que a regulada pelo mercado. Ex.: Carnaval, festas juninas, samba, capoeira, funk. Muitas foram <b>estigmatizadas e perseguidas</b> antes de ganhar respeito; com o tempo são assimiladas pela <b>indústria cultural</b>.</li>
    <li><b>Erudita</b>: feita por artistas com grande especialização e voltada às <b>camadas privilegiadas</b>; surgiu na Europa moderna. <b>Norbert Elias</b> (processo civilizador; <i>Mozart, sociologia de um gênio</i>) mostra o papel da nobreza e depois da burguesia. Marcas: <b>formalidade</b>, locais específicos (salas de concerto, museus), <b>seletividade</b>. <b>Bourdieu</b>: gostos como meio de <b>distinção social</b>.</li>
   </ul>` },
  { t: "Patrimônio, cultura material e imaterial", html: `
   <p><b>Bens culturais</b> transmitidos entre gerações formam o <b>patrimônio histórico-cultural</b>, que precisa ser <b>reconhecido</b> por órgãos como o <b>IPHAN</b> e a <b>UNESCO</b>. A Constituição Federal (art. 216) define patrimônio cultural brasileiro como bens <b>materiais e imateriais</b> portadores de referência à identidade, à ação e à memória dos grupos formadores da sociedade.</p>
   <ul>
    <li><b>Material</b>: bens físicos e palpáveis (quadro, escultura, Cristo Redentor, tombado em 2008).</li>
    <li><b>Imaterial</b>: elementos abstratos, não palpáveis: idioma, dança, comidas típicas, festas. Ex.: o <b>ofício das Baianas de Acarajé</b> (Livro dos Saberes, 2005).</li>
   </ul>` },
  { t: "Alteridade, etnocentrismo e estranhamento", html: `
   <p><b>Alteridade</b>: condição de ser o “outro”; reconhecer e tolerar o que é diferente (plano social, econômico, cultural, linguístico, político). É princípio fundamental da prática antropológica, necessária para a imersão. Difere de <b>empatia</b>: empatia é colocar-se na situação do outro em uma circunstância específica; alteridade é reconhecer <b>de forma contínua</b> que o outro é diferente e adotar uma <b>postura constante de respeito à sua singularidade</b> (Santos e Mestre).</p>
   <p><b>Etnocentrismo</b>: visão de mundo em que o <b>próprio grupo é o centro</b> de tudo e os outros são pensados e sentidos pelos nossos valores (Everardo Rocha). Pode levar a <b>racismo, intolerância, violência e exclusão</b>. No Brasil, os colonizadores viam os nativos como sujeitos “sem alma”. Antídotos: <b>relativismo cultural, alteridade e estranhamento</b>.</p>
   <p><b>Estranhamento e desnaturalização</b>: agir “no automático” (escovar os dentes, tomar café de manhã) mostra hábitos culturalmente construídos. <b>Estranhamento</b> é o esforço de observar com estranheza o que é corriqueiro. Para <b>Roberto DaMatta</b>, o antropólogo tem dupla tarefa: <b>transformar o exótico em familiar e o familiar em exótico</b>; exige “desligamento emocional”. Bodart: serve para <b>desconfiar do que foi tomado como normal</b> (ex.: o padrão de beleza alta, branca, magra e jovem, recente, da segunda metade do séc. XX).</p>` },
  { t: "Estudos pós-coloniais e lugar de fala", html: `
   <p>A partir dos anos 1980 (e do pós-guerra), países do sul global formaram pesquisadores e criticaram o fato de só <b>cientistas brancos ocidentais</b> falarem sobre a cultura dos outros, produzindo representações irreais baseadas em estereótipos. É o movimento dos <b>Estudos Pós-coloniais</b>.</p>
   <ul>
    <li><b>Frantz Fanon</b>: representações das populações negras não condiziam com a realidade; complexo de inferioridade imposto.</li>
    <li><b>Edward Said</b> (<i>Orientalismo</i>): o “Oriente” é uma <b>invenção ocidental</b>, marcada por exotismo e inferioridade.</li>
    <li><b>Gayatri Spivak</b>: o sujeito <b>subalterno</b> (camadas mais baixas, especialmente mulheres) é silenciado.</li>
    <li><b>Djamila Ribeiro</b> (<b>lugar de fala</b>): o lugar social não determina uma consciência discursiva sobre ele, mas nos faz ter <b>experiências distintas e outras perspectivas</b>. Não significa que quem está fora do grupo não possa opinar; é preciso dar voz e <b>ouvir</b> quem foi silenciado.</li>
    <li><b>James Clifford e George Marcus</b> (1986): crítica à autoria das etnografias; qual o papel do interlocutor?</li>
   </ul>` }
 ],
