[12,"Observação participante","Método de Malinowski: imersão na cultura estudada (aprender a língua, os costumes e os rituais)."],
[12,"Particularismo histórico","Princípio de Boas: cada cultura tem história e valores únicos; não há linha única de desenvolvimento."],
[12,"Relativismo cultural","Princípio de Boas: não há hierarquia entre culturas; estuda-se cada uma em seus próprios termos."],
[12,"Ethos","Conjunto de traços que formam o caráter e a identidade de um grupo (Escola de Cultura e Personalidade; Ruth Benedict)."],
[12,"Cultura popular","Saberes e práticas das camadas populares, mais espontâneos e livres (samba, capoeira, Carnaval), muitas vezes estigmatizados antes de serem reconhecidos."],
[12,"Cultura erudita","Feita por e para a elite, com especialização e espaços seletivos; funciona como distinção social (Elias, Bourdieu)."],
[12,"Patrimônio histórico-cultural","Bens culturais reconhecidos (IPHAN, UNESCO) e transmitidos entre gerações."],
[12,"Cultura material × imaterial","Material: bens físicos e palpáveis. Imaterial: idioma, dança, comidas típicas, festas, saberes."],
[12,"Alteridade","Condição de ser o outro; reconhecer, de forma contínua, que o outro é diferente e respeitar sua singularidade."],
[12,"Etnocentrismo","Visão de mundo em que o próprio grupo é o centro e os outros são julgados pelos nossos valores."],
[12,"Estranhamento","Esforço de observar com estranheza o que é familiar (DaMatta): tornar o familiar exótico e o exótico familiar."],
[12,"Desnaturalização","Perceber como construído socialmente aquilo que parece natural (ex.: padrões de beleza)."],
[12,"Estudos pós-coloniais","Crítica ao fato de só pesquisadores brancos ocidentais falarem sobre a cultura dos outros (Fanon, Said, Spivak)."],
[12,"Lugar de fala","Djamila Ribeiro: o lugar social não determina a consciência, mas gera experiências e perspectivas distintas; é preciso ouvir os silenciados."]
];

/* Questões objetivas. Formato: c = capítulo; q = enunciado; t = texto-base/cena (opcional);
   a = alternativas (a[0] é a CORRETA; o app embaralha); e = comentário. */
window.QUIZ = [
/* ===================== CAP. 01 ===================== */
{c:1, t:"Em 1811, grupos de trabalhadores ingleses invadiram fábricas têxteis e quebraram teares, acreditando que as máquinas eram responsáveis pelo desemprego. Anos depois, outro movimento reuniu milhares de assinaturas exigindo o voto universal masculino e a presença de operários no parlamento.",
 q:"Os dois movimentos descritos são, respectivamente:",
 a:["o ludismo e o cartismo.","o cartismo e o ludismo.","o sindicalismo e o ludismo.","o positivismo e o cartismo.","o darwinismo social e o sindicalismo."],
 e:"Destruir máquinas é a marca do ludismo (curto e reprimido). O cartismo lutou por direitos trabalhistas e políticos, como o sufrágio universal masculino e a representação no parlamento."},
{c:1, t:"Uma comunidade explica a estiagem como castigo de entidades sobrenaturais. Mais tarde, pensadores passam a explicá-la por princípios abstratos e racionais, sem observar o clima. Por fim, cientistas registram chuvas, temperaturas e solo para entender o fenômeno.",
 q:"Segundo a lei dos três estados de Auguste Comte, as três explicações correspondem, na ordem, aos estados:",
 a:["teológico, metafísico e positivo.","metafísico, positivo e teológico.","positivo, teológico e metafísico.","teológico, positivo e metafísico.","metafísico, teológico e positivo."],
 e:"Explicação sobrenatural = teológico; teorias racionais sem observação da natureza = metafísico; busca de respostas na própria natureza, com método científico = positivo."},
{c:1, q:"A expressão “spencerismo social” é preferida por alguns autores ao termo “Darwinismo Social” porque:",
 a:["Darwin tratava de espécies e nunca construiu hierarquias entre elas, ao contrário do que a doutrina de Spencer fez com as sociedades.","Spencer foi o biólogo que formulou a seleção natural antes de Darwin.","a doutrina rejeita a ideia de evolução e defende a imutabilidade das sociedades.","Spencer criticava a hierarquização racial e defendia a igualdade entre os povos.","o termo se refere ao método de casos criado por Spencer."],
 e:"O darwinismo social é uma aplicação enviesada da evolução: Darwin falou de espécies, não de sociedades humanas, e não criou hierarquias entre elas. O nome “Darwinismo” induz a uma ligação que não existe."},
{c:1, t:"Um trabalhador assina contrato que fixa sua jornada, seus direitos e seu salário. Ele não escolhe onde nem como trabalhará: tudo isso já foi imposto pelo empresário e pelo meio social.",
 q:"Para Marx e Engels, essa situação mostra que a relação entre empresário e trabalhador é:",
 a:["aparentemente um contrato entre iguais, mas na prática uma relação entre classes antagônicas.","uma troca justa entre indivíduos livres, que o Estado deve evitar regular.","resultado de uma ação social afetiva, movida por emoções.","um fato social de solidariedade orgânica entre as classes.","um estado teológico de explicação da vida econômica."],
 e:"O contrato parece ser entre iguais, mas isso é apenas aparência. A relação é entre classes (proletariado, que vende força de trabalho, e burguesia, que a compra) e é marcada pelo antagonismo."},
{c:1, t:"Em uma cidade, ninguém decide sozinho como cumprimentar os outros, que roupa usar em um velório ou como se comportar em um tribunal. Essas maneiras de agir existem antes de cada pessoa e cobram sanção de quem as desrespeita.",
 q:"Na Sociologia de Durkheim, essas maneiras de agir se enquadram como:",
 a:["fatos sociais, pois são exteriores ao indivíduo, gerais e coercitivos.","ações sociais, pois dependem apenas do sentido atribuído por cada pessoa.","mais-valia, pois resultam da exploração do trabalho.","tipos ideais, pois são conceitos criados pelo pesquisador.","estados metafísicos, pois dispensam a observação social."],
 e:"Fato social é a maneira de agir, pensar e sentir exterior ao indivíduo, geral na sociedade e dotada de poder de coerção. Ação social e sentido subjetivo são conceitos de Weber."},
{c:1, t:"Mariana não sabe bem por quê, mas acende uma vela a um santo todo ano, como fazia sua avó. Carlos aceita um emprego depois de calcular salários, custos e chances de promoção. Rita grita com um colega no calor de uma discussão. Paulo devolve uma carteira achada, porque considera isso seu dever, mesmo sem recompensa.",
 q:"Quem exemplifica a ação racional com relação a fins, de Max Weber?",
 a:["Carlos, que mede as consequências e programa o resultado.","Mariana, que age por hábito e tradição familiar.","Rita, que age movida por emoção.","Paulo, que age por convicção ética, sem pensar no resultado.","Nenhum deles, pois a ação racional só existe em instituições."],
 e:"Mariana = tradicional; Rita = afetiva; Paulo = racional com relação a valores; Carlos pesa os resultados antes de agir = racional com relação a fins."},
{c:1, t:"Uma equipe aplica um questionário padronizado a 3 mil moradores de uma região para saber renda, escolaridade e condições de moradia, e depois trata os números estatisticamente.",
 q:"O método utilizado é o:",
 a:["de medida, voltado a populações amplas e à análise quantitativa.","de casos, que examina intensivamente uma única comunidade.","experimental, que comprova relação causal em laboratório.","etnográfico, baseado em imersão de longo prazo no grupo.","positivo, usado só por Comte para explicar o sobrenatural."],
 e:"O método de medida surgiu nas Ciências Sociais (Inglaterra, séc. XIX) e observa populações amplas por meio de perguntas, para análise quantitativa. O de casos é intensivo e qualitativo."},
{c:1, q:"Um dos principais efeitos da passagem da manufatura para a maquinofatura sobre o trabalhador foi:",
 a:["dispensar a habilidade manual e contribuir para a redução dos salários.","valorizar o artesão, que passou a receber mais para operar máquinas.","reduzir as jornadas para menos de 8 horas diárias.","eliminar o trabalho de mulheres e crianças nas fábricas.","acabar com a formação de sindicatos, por não haver conflitos."],
 e:"Com as máquinas, não era mais necessário um trabalhador com habilidades manuais. A consequência foi a redução dos salários e a precarização da vida, jornadas de até 16 horas e trabalho de mulheres e crianças."},
{c:1, q:"Robótica, eletrônica e informática, com o Japão como novo território de expansão, caracterizam qual fase da Revolução Industrial?",
 a:["A terceira.","A primeira.","A segunda.","A quarta.","Nenhuma: são fenômenos anteriores à industrialização."],
 e:"1ª: máquina a vapor e têxteis (Inglaterra). 2ª: petróleo e automobilística (Europa e EUA). 3ª: robótica, eletrônica e informática (Japão). 4ª: globalização, inteligência artificial, internet das coisas etc."},
/* ===================== CAP. 02 ===================== */
{c:2, t:"Em uma partida de vôlei de bairro, jogadores, árbitro, torcida e regras formam um fluxo contínuo em que cada um age em função dos outros. Fora desse conjunto, o “jogo” deixa de existir.",
 q:"O conceito de Norbert Elias que descreve essa situação é:",
 a:["configuração, que mostra a interdependência entre as pessoas.","anomia, que designa a ausência de normas.","fato social, que indica coerção externa sobre o indivíduo.","mais-valia, que mede o lucro do proprietário.","poder carismático, que se baseia no afeto pelo líder."],
 e:"Configuração é o conjunto de “eus”, “eles” e “nós” em relações de interdependência. O exemplo do próprio texto é a partida de futebol."},
{c:2, q:"De acordo com o capítulo, a consciência do indivíduo, tal como a entendemos hoje, ganha relevância social sobretudo:",
 a:["na Modernidade, com a Reforma Protestante e o capitalismo e o pensamento liberal.","na Antiguidade, com a vida na pólis grega.","na Idade Média, com a vida dos clãs feudais.","na pré-história, com o surgimento dos hominídeos.","em todas as épocas e sociedades, do mesmo modo."],
 e:"Antes da Modernidade valia o grupo (clã, família, Estado). A ideia de indivíduo ganha força com a Reforma Protestante (séc. XVI) e se estrutura em definitivo no séc. XVIII, com o capitalismo e o liberalismo."},
{c:2, t:"I. Aulas de catequese na igreja da cidade.\nII. A conversa em que um adolescente aprende gírias com os amigos do bairro.\nIII. As regras escolares sobre pontualidade e uniforme.\nIV. A fiscalização do alistamento militar pelo Estado.",
 q:"Entre as situações, exemplifica a socialização informal:",
 a:["Somente a II.","I e III.","III e IV.","I, III e IV.","Todas, porque toda socialização é informal."],
 e:"A socialização formal é imposta por instituições (igreja, escola, Estado: I, III, IV). A informal acontece em relações cotidianas como família, vizinhança e amigos (II)."},
{c:2, q:"A família é tratada no capítulo como o “ponto de partida” da socialização informal porque:",
 a:["é o espaço privado de afeto em que se aprende, ao lado das regras de convivência, a lidar com as diferenças.","impede que o indivíduo seja influenciado por qualquer outro grupo social.","define de modo imutável a personalidade de cada pessoa.","é a única instituição que transmite valores e normas.","substitui a escola e os meios de comunicação na formação."],
 e:"A família costuma ser a primeira e mais antiga relação socializadora, de intimidade e afeto, onde se aprende a obedecer regras e a conviver com a diversidade. Mas não é a única nem determina o indivíduo."},
{c:2, q:"Segundo o capítulo, os agentes de socialização mais eficazes e persuasivos, tanto nos espaços privados quanto nos públicos, são:",
 a:["os meios de comunicação, parte da “cultura e ideologia”.","os partidos políticos e sindicatos.","os grupos de vizinhança, que substituem a família.","as corporações de ofício e as guildas.","as instituições científicas e universitárias."],
 e:"Cinema, rádio, televisão, jornais, telefones, internet e revistas atuam em ambos os espaços e participam da cultura e da ideologia de uma sociedade."},
{c:2, t:"Uma filha de operários e um filho de empresários escolhem como passar o tempo livre, o que consideram “de bom gosto” e como se expressam politicamente. As escolhas de cada um refletem a posição social e a trajetória de suas famílias.",
 q:"Em Bourdieu, o conceito que ajuda a entender esse fenômeno é:",
 a:["habitus, disposições incorporadas ligadas ao lugar ocupado na sociedade.","anomia, ausência de normas integradoras.","ação tradicional, baseada em costumes de gerações.","solidariedade mecânica, em que todos fazem tudo.","antagonismo de classes, que prevê a revolução."],
 e:"Para Bourdieu o habitus é social e individual, estruturado por instituições de socialização e pelo lugar que cada um ocupa numa sociedade desigual. Ele orienta gostos e práticas."},
{c:2, q:"Sobre a relação entre os conceitos de habitus em Norbert Elias e em Pierre Bourdieu, é correto afirmar que:",
 a:["Bourdieu retoma o conceito de Elias com o mesmo objetivo teórico: conectar indivíduos e sociedade.","Bourdieu rejeita o conceito, por considerá-lo uma ideia do positivismo.","os dois autores usam o termo para designar apenas a coerção externa do Estado.","Elias o define como produto da vontade individual, sem relação com a sociedade.","Bourdieu o aplica apenas a indivíduos isolados, nunca a grupos ou classes."],
 e:"Segundo o capítulo, não existe diferença de fundo: ambos querem articular indivíduo e sociedade. Em Bourdieu, o habitus pode ser aplicado a grupo, classe ou indivíduo."},
{c:2, t:"Em uma cidade moderna, ninguém produz tudo o que consome. Dentistas, professores, pedreiros, motoristas e cirurgiões, cada um com seu ofício, dependem uns dos outros para sobreviver.",
 q:"Para Durkheim, essa situação ilustra a:",
 a:["solidariedade orgânica, baseada na divisão do trabalho e na interdependência.","solidariedade mecânica, típica de sociedades pouco complexas.","alienação, em que o trabalhador não reconhece o produto de seu trabalho.","ética protestante, que valoriza o trabalho como vocação.","anomia, que impede qualquer coesão."],
 e:"Na solidariedade orgânica a divisão do trabalho já existe e ninguém domina todas as técnicas; por isso as pessoas dependem umas das outras, o que gera coesão social."},
{c:2, t:"O proprietário de uma fábrica paga ao operário um salário menor do que o valor do que ele produz e fica com a diferença como lucro. Esse arranjo é aceito diariamente como algo natural, sem que os trabalhadores o percebam como exploração.",
 q:"Para Marx, a naturalização e a não percepção desse processo é denominada:",
 a:["alienação, sustentada pela ideologia burguesa.","anomia, resultado da falta de normas.","configuração, em que há interdependência.","solidariedade orgânica, que gera coesão.","poder legal, fundado na ordem jurídica."],
 e:"A diferença apropriada pelo proprietário é a mais-valia. A naturalização disso é a alienação, possível pelo processo de socialização imposto pela burguesia: a ideologia burguesa."},
/* ===================== CAP. 07 ===================== */
{c:7, q:"Do ponto de vista sociológico, raça e etnia devem ser entendidas como:",
 a:["construções sociais, ligadas a relações de poder, privilégio e status.","categorias biológicas fixas, que explicam as diferenças de comportamento.","sinônimos de classe social, sem relação com a cultura.","conceitos abandonados pela Sociologia contemporânea.","características que independem da interação social."],
 e:"A cor da pele não é biologicamente herdada como categoria social. A Sociologia estuda como as identidades raciais e étnicas são formadas e negociadas em contextos de poder."},
{c:7, t:"Um lojista acredita que jovens negros costumam furtar. Quando um jovem negro entra na loja, ele o segue pelos corredores, mas não faz o mesmo com outros clientes.",
 q:"Em termos sociológicos, o sentimento do lojista e a atitude de vigiar só um grupo são, respectivamente:",
 a:["preconceito e discriminação.","discriminação e preconceito.","segregação e racismo estrutural.","interseccionalidade e branquitude.","etnicidade e meritocracia."],
 e:"Preconceito é uma ideia ou atitude negativa por pertencer a um grupo; discriminação é o tratamento desigual na prática. A segregação é a separação espacial ou institucional."},
{c:7, t:"Em uma empresa, ninguém declara intenção racista. Mesmo assim, os processos de seleção, as redes de indicação e o perfil da diretoria reproduzem durante décadas a ausência de pessoas negras em cargos de comando.",
 q:"De acordo com Silvio Almeida, esse quadro é característico de:",
 a:["racismo estrutural, que resulta de arranjos institucionais e relações de poder, muitas vezes inconscientes.","racismo individual, que só existe quando há intenção explícita de discriminar.","etnocentrismo, que julga as culturas pelos valores do pesquisador.","meritocracia, em que o resultado reflete apenas o esforço pessoal.","estranhamento, que desnaturaliza o familiar."],
 e:"Racismo estrutural é um sistema invisível de regras, instituições e práticas que favorece certos grupos além da discriminação individual, mantendo vantagens (muitas vezes inconscientes) de herança da escravização e da colonização."},
{c:7, q:"O capítulo afirma que a relação entre racismo e escravização é “intrínseca”. Isso significa que:",
 a:["a ideia de inferioridade da pessoa negra foi construída para justificar o tráfico, a exploração e o poder econômico.","o racismo surgiu de diferenças biológicas comprovadas entre os povos.","o racismo é natural e existiu em todas as sociedades pelas mesmas razões.","a escravização foi consequência do racismo, e não o contrário, por não ter motivações econômicas.","só os colonizadores se beneficiaram da escravização, sem relação com o racismo."],
 e:"Para justificar o tráfico de escravizados e a exploração, construiu-se a ideia de que a pessoa negra era inferior. O estigma foi construído e consolidado ao longo dos séculos."},
{c:7, q:"O conceito de “privilégio branco” se refere a:",
 a:["ganhos imerecidos associados à branquitude, como proteção contra discriminação e melhores oportunidades.","vantagens conquistadas apenas pelo mérito individual dos brancos.","um sistema de poder usado para beneficiar os negros.","direitos exclusivos garantidos por lei a pessoas brancas no Brasil.","uma categoria biológica que explica diferenças de desempenho."],
 e:"O privilégio branco é um conjunto de ganhos imerecidos (emprego, justiça criminal, educação, saúde, moradia, poder político). A branquitude é um sistema de poder que posiciona o branco como norma."},
{c:7, t:"Uma mulher negra, pobre e moradora de periferia relata que, nos processos seletivos, enfrenta barreiras diferentes das de um homem negro de classe média e das de uma mulher branca pobre.",
 q:"A principal utilidade analítica do conceito de interseccionalidade, nesse caso, é:",
 a:["mostrar que raça, classe e gênero se combinam e produzem formas simultâneas de opressão.","isolar o fator raça e tratá-lo como única causa da exclusão.","negar a existência de desigualdades entre grupos.","afirmar que todos os grupos são oprimidos do mesmo modo.","explicar a desigualdade como falta de esforço individual."],
 e:"Interseccionalidade é o cruzamento de raça, classe e gênero, que operam simultaneamente e geram sistemas de opressão e dominação mais intensos."},
{c:7, t:"Um grupo de amigos reproduz há anos piadas sobre minorias, sem nunca ter conhecido pessoas desses grupos e sem que ninguém questione a prática.",
 q:"Segundo o capítulo, esse quadro revela os dois fatores que geram o racismo:",
 a:["ignorância e pensamento de grupo.","anomia e fato social.","mais-valia e alienação.","etnocentrismo e relativismo.","alteridade e empatia."],
 e:"Ignorância = falta de conhecimento sobre outras sociedades e culturas. Pensamento de grupo = ideias e crenças institucionalizadas em grupos que não valorizam o pensamento crítico."},
{c:7, t:"Dados do Atlas da Violência citados no capítulo indicam que um jovem negro tem 2,6 vezes mais chance de ser morto no Brasil do que um jovem branco.",
 q:"O dado é usado no texto para sustentar a ideia de que:",
 a:["a luta contra o racismo é pauta fundamental contra as desigualdades e para a democracia.","a violência no Brasil decorre unicamente da pobreza, sem relação com a raça.","a discriminação racial desapareceu após a abolição.","as políticas de ação afirmativa são a única solução necessária.","a questão racial é restrita aos Estados Unidos."],
 e:"O capítulo relaciona violência policial e desigualdade e afirma que, “com racismo, não há democracia”. Como lembra Munanga, não há fórmulas prontas, mas a educação contribui."},
{c:7, q:"Segundo Kabengele Munanga, no combate ao racismo na sociedade brasileira:",
 a:["a educação familiar e escolar contribui, embora ninguém disponha de fórmulas prontas e duradouras.","basta aplicar um método educativo único em todas as escolas.","a escola não tem nenhum papel, cabendo tudo à família.","o problema não existe no Brasil, ao contrário dos EUA e da África do Sul.","o primeiro passo é negar o racismo para evitar conflitos."],
 e:"Munanga afirma que a educação pode contribuir fortemente, mas não há fórmulas prontas. A primeira atitude corajosa é admitir que nossa sociedade também é racista."},
/* ===================== CAP. 09 ===================== */
{c:9, q:"Sobre as chamadas “sociedades antigas”, o capítulo afirma que nelas:",
 a:["as atividades de subsistência se integram a rituais, mitos, festas, artes e parentesco, sem a esfera separada que chamamos de trabalho.","todo trabalho era feito por escravizados, como em Roma.","a produção era organizada em fábricas e por assalariados.","havia ampla divisão de classes proprietárias.","a pobreza era resultado do próprio modo de vida."],
 e:"Nelas todos fazem quase tudo, e a divisão de tarefas é por sexo e idade. A associação com “pobreza” é hoje considerada preconceito; a dificuldade atual decorre do contato com o “mundo civilizado”."},
{c:9, t:"Um jovem de 13 anos entra como aprendiz em uma oficina de sapatos de uma cidade medieval. Quem organiza sua jornada e sua remuneração e lhe transmite os ensinamentos do mestre é o oficial, enquanto o mestre controla todo o trabalho e responde pelos pagamentos ao rei e ao senhor feudal.",
 q:"A organização descrita corresponde:",
 a:["às corporações de ofício do feudalismo.","à fábrica fordista do séc. XX.","à linha de montagem toyotista.","à organização do trabalho nas sociedades antigas.","à uberização do trabalho."],
 e:"Nas corporações de ofício havia hierarquia rígida: mestre (topo), oficial (intermediário) e aprendiz (12 a 15 anos, subordinado a um só mestre)."},
{c:9, q:"Para que o trabalho deixasse de ser visto como atividade vil e passasse a ser entendido como digno, a estrutura social, segundo o capítulo:",
 a:["separou a casa do local de trabalho, segregou o trabalhador de seus instrumentos e retirou dele o acesso à matéria-prima.","devolveu aos artesãos a propriedade das ferramentas e das matérias-primas.","fortaleceu as corporações de ofício e a autonomia dos mestres.","eliminou a lei da oferta e da procura.","acabou com o mercantilismo e com as relações de mercado."],
 e:"Comerciantes e industriais enriquecidos passaram a financiar e coordenar a produção, definindo o que e quanto produzir. O trabalhador ficou com a força de trabalho como única mercadoria."},
{c:9, t:"Rafael opera uma máquina de cortar peças em uma montadora. Ele nunca vê o carro pronto, não decide o ritmo nem o destino do que produz e, ao fim do dia, sente que o resultado do seu trabalho não lhe pertence.",
 q:"Segundo Marx, a experiência de Rafael ilustra a:",
 a:["alienação, em que o trabalhador não se reconhece no que produz.","solidariedade orgânica, que gera coesão pela interdependência.","ética protestante, que vê no trabalho uma vocação divina.","anomia, resultante de normas insuficientes.","ação racional com relação a valores."],
 e:"Para Marx, o trabalhador vende sua força de trabalho; quanto mais produz, mais impotente fica, pois não vê o produto como seu."},
{c:9, q:"Em A ética protestante e o espírito do capitalismo (1905), Max Weber sustenta que:",
 a:["a lógica calvinista exaltou o trabalho duro e a acumulação de riqueza, ajudando a formar o espírito capitalista.","o capitalismo nasceu da solidariedade mecânica das aldeias.","o catolicismo promoveu a acumulação de riqueza pela usura.","a divisão do trabalho cria conflitos de classe inevitáveis.","o trabalho é uma extensão do fato social e da anomia."],
 e:"Os calvinistas inverteram a lógica católica da usura (pecado) e viram no trabalho uma vocação, um chamado de Deus. Para Weber, isso foi fundamental ao desenvolvimento do espírito capitalista."},
{c:9, t:"Em uma pequena comunidade rural, quase todos sabem plantar, construir, pescar e fazer ferramentas, e os costumes são muito parecidos entre os moradores.",
 q:"Para Durkheim, esse tipo de coesão é a:",
 a:["solidariedade mecânica, típica de sociedades menos complexas.","solidariedade orgânica, típica de sociedades industriais.","anomia, que dissolve as instituições.","alienação, que oculta a exploração.","pejotização, que reduz direitos."],
 e:"Na solidariedade mecânica as pessoas se assemelham e fazem quase tudo para sobreviver. Na orgânica há divisão do trabalho e interdependência das funções sociais."},
{c:9, t:"Em uma indústria do início do século XX, cada operário repete uma tarefa em uma esteira, sob controle rígido. A empresa reduz o preço dos carros para que seus próprios empregados possam comprá-los, e adota jornada de 8 horas e salário diário.",
 q:"O modelo de produção descrito é o:",
 a:["fordismo, com produção e consumo em massa e taylorismo.","toyotismo, com produção just-in-time e trabalhador polivalente.","feudalismo, com servos ligados à terra.","artesanato das corporações de ofício.","trabalho por aplicativo (uberização)."],
 e:"Henry Ford implantou a linha de montagem (1914) e adotou o taylorismo; estabeleceu jornada de 8 horas e salário por dia, inaugurando o consumo e a produção em massa."},
{c:9, t:"Uma montadora japonesa mantém estoques mínimos: as peças chegam de fornecedores instalados perto da fábrica exatamente quando são necessárias, e só se produz o que foi encomendado. Os operários precisam atuar em várias funções.",
 q:"Esse modelo é o:",
 a:["toyotismo (just-in-time), que reduz desperdícios e exige flexibilidade.","fordismo, que acumula estoques para vender em massa.","taylorismo clássico, que cronometra cada movimento.","mercantilismo, que garante estoques do Estado.","modelo das sociedades antigas."],
 e:"O toyotismo organiza fornecedores, fábrica e compradores em rede, reduz custos de estoque e valoriza qualidade total e mão de obra flexível."},
{c:9, q:"Sobre as transformações pós-1970 (flexibilização), o capítulo afirma que:",
 a:["o desemprego conjuntural tornou-se estrutural: já não há emprego formal para a maioria e muitos trabalharão de modo precário.","o trabalhador especializado passou a ser a figura mais valorizada.","a automação aumentou o controle manual sobre o trabalho.","as leis trabalhistas foram ampliadas e os sindicatos, fortalecidos.","o modelo foi superado pela volta do taylorismo puro."],
 e:"Após a crise do petróleo e com automação, robótica e informatização, exige-se disponibilidade para adaptar-se a várias funções. Harvey chama esse padrão de acumulação flexível."},
{c:9, t:"Uma empresa de logística exige que seus prestadores de serviço abram um CNPJ, mas os obriga a cumprir horários e metas fixos, como se fossem empregados, sem direitos trabalhistas.",
 q:"A prática descrita é conhecida como:",
 a:["pejotização, que maquia a relação de trabalho e reduz direitos.","uberização, em que o trabalhador paga apenas pelo seu CNPJ.","toyotismo, que valoriza trabalhadores especializados.","fordismo, que garante jornada de 8 horas.","corporação de ofício, em que o mestre fixa a jornada."],
 e:"A pejotização surge para maquiar a relação de trabalho, reduzindo direitos e trazendo benefícios ao empregador. Na uberização, o trabalhador também põe seus meios à disposição da plataforma."},
/* ===================== CAP. 10 ===================== */
{c:10, t:"Em uma comunidade, a autoridade do chefe é aceita porque sempre foi assim: o cargo passa de pai para filho e ninguém questiona.",
 q:"Segundo a classificação de Weber, trata-se de poder:",
 a:["tradicional, baseado em costumes que atravessam gerações.","legal, fundado na ordem jurídica.","carismático, baseado no afeto e no dom do líder.","econômico, baseado nas posses.","ideológico, baseado na propaganda."],
 e:"Poder legal = leis e burocracia; tradicional = costumes e hábitos que passam por gerações; carismático = afeto e admiração por um líder visto como heroico ou sagrado."},
{c:10, t:"Em uma fazenda isolada, o proprietário cobra preços altíssimos pelos produtos que vende a seus funcionários, que não têm como sair dali, e impõe jornadas árduas.",
 q:"Esse exemplo ilustra o poder:",
 a:["econômico, em que quem tem muito mais posses oprime os que dependem dele.","político, em que um grupo monopoliza a força militar.","ideológico, em que a propaganda exalta um estilo de governo.","legal, em que a lei é aplicada de modo impessoal.","carismático, em que o líder é visto como sagrado."],
 e:"O capítulo usa exatamente esse tipo de situação para o poder econômico. O poder político envolve controle da força militar e das instituições; o ideológico, da comunicação e propaganda."},
{c:10, q:"Para Thomas Hobbes, a origem do Estado está:",
 a:["em um contrato (pacto) social que freia a violência do estado de natureza e dá origem a um Estado absolutista.","na bondade natural do ser humano, corrompido pela propriedade.","na necessidade de dividir o poder em Legislativo, Executivo e Judiciário.","na defesa da livre iniciativa e do laissez-faire.","na revolução proletária, que extingue as classes."],
 e:"Hobbes via o ser humano como mau em estado de natureza (“o homem é o lobo do homem”), exigindo um Estado forte, o Leviatã, comandado pelo rei."},
{c:10, t:"“O ser humano nasce bom, livre e feliz, mas a sociedade o corrompe, criando desejos de luxo, poder, inveja e guerras. A propriedade privada é o pecado original da sociedade.”",
 q:"A ideia pertence a:",
 a:["Rousseau.","Hobbes.","Locke.","Maquiavel.","Montesquieu."],
 e:"Rousseau é pessimista quanto à sociedade e critica tanto o absolutismo de Hobbes quanto a liberalidade de Locke."},
{c:10, t:"Um país decide que o poder será dividido: um órgão elabora as leis, outro as executa, e um terceiro fiscaliza sua aplicação, para evitar que um só governante concentre poder demais.",
 q:"A proposta é de:",
 a:["Montesquieu.","Maquiavel.","Bodin.","Hegel.","Benjamin Constant."],
 e:"Montesquieu propôs a separação em Legislativo (propõe), Executivo (executa) e Judiciário (fiscaliza). Ela é praticada até hoje em diversos países."},
{c:10, q:"No Estado absolutista, a frase de Luís XIV, “L’État c’est moi”, expressa:",
 a:["a confusão entre o poder do Estado e a pessoa do monarca, com poder concentrado no soberano.","a soberania popular e o fortalecimento do Parlamento.","a divisão do poder entre três órgãos independentes.","a defesa da livre concorrência e da mão invisível.","a propriedade coletiva dos meios de produção."],
 e:"No absolutismo o poder se concentrava no monarca, com aliança entre nobreza, clero e burguesia, forte intervenção na economia e expansão colonial."},
{c:10, t:"Um economista defende que o governo não deve fixar preços nem interferir nos mercados, pois uma “mão invisível” regularia a economia, e que o Estado deve se limitar à segurança, à justiça e às obras públicas básicas, protegendo a propriedade privada.",
 q:"O pensamento descrito corresponde ao Estado:",
 a:["liberal, cuja principal referência econômica é Adam Smith.","absolutista, cuja referência é Luís XIV.","soviético, cuja referência é a Revolução Russa.","de bem-estar social, cuja referência é Keynes.","fascista, cuja referência é Mussolini."],
 e:"O liberalismo (laissez-faire) defende o Estado laico e restrito à esfera política e à res publica, com respeito à propriedade e soberania popular."},
{c:10, q:"Sobre o Estado soviético, formado após a Revolução Russa de 1917, é correto afirmar que:",
 a:["propôs o fim da propriedade privada em favor de propriedades coletivas e centralizou o poder no Partido Comunista.","manteve a propriedade privada e o capitalismo.","defendeu a supremacia de uma raça sobre as demais.","foi um modelo de Estado mínimo e livre mercado.","chegou ao poder por decisão dos parlamentos."],
 e:"A URSS foi dissolvida após a queda do Muro de Berlim (1989). Países como Cuba, Vietnã, China e Coreia do Norte mantêm modelo de partido único e economia centralizada."},
{c:10, q:"Sobre a ascensão dos Estados fascistas na Itália e na Alemanha, o capítulo destaca que:",
 a:["Mussolini e Hitler chegaram ao poder por vias legais, por decisões dos parlamentos, e mantiveram o capitalismo e a propriedade privada.","ambos chegaram por golpes de Estado militares.","aboliram a propriedade privada e estatizaram a economia.","defenderam a igualdade entre todas as raças.","rejeitaram o nacionalismo em nome do internacionalismo."],
 e:"Fascismo e nazismo combinaram nacionalismo, líder supremo, hierarquia e perseguição a quem era considerado inimigo da nação (judeus, eslavos, ciganos, comunistas)."},
{c:10, q:"Segundo as características apontadas por Friedrich e Brzezinski, NÃO é traço do Estado totalitário:",
 a:["o pluralismo partidário, com imprensa independente e eleições livres.","a ideologia oficial.","o partido único dirigido por um ditador.","o terrorismo policial.","o monopólio dos meios de comunicação de massa e da luta armada."],
 e:"As características do totalitarismo: ideologia oficial; partido único dirigido por um ditador; terrorismo policial; monopólio dos meios de comunicação e da luta armada; controle central da economia."},
{c:10, t:"Após a quebra da Bolsa de Nova York em 1929, o governo passa a financiar grandes obras para gerar empregos, regula atividades econômicas e amplia serviços de saúde, educação e seguro-desemprego.",
 q:"O modelo de Estado descrito é:",
 a:["o de bem-estar social, inspirado nas ideias de Keynes.","o neoliberal, defendido por Hayek e Friedman.","o absolutista, defendido por Bodin.","o liberal clássico, defendido por Adam Smith.","o fascista, defendido por Mussolini."],
 e:"A teoria keynesiana (Teoria geral do emprego, do juro e da moeda, 1936) é frontalmente oposta ao liberalismo, pois prevê intervenção estatal. Foi aplicada no pós-guerra nos EUA e na Europa."},
{c:10, q:"Segundo Hayek e Friedman, a crise do capitalismo no fim dos anos 1970 deveu-se principalmente:",
 a:["aos gastos dos governos com políticas sociais, que geravam endividamento, impostos e inflação.","à falta de intervenção do Estado na economia.","ao excesso de liberdade de mercado.","ao fim do Estado absolutista.","à falta de sindicatos fortes."],
 e:"Daí o Estado neoliberal: Estado mínimo, privatização de serviços, livre mercado e individualismo, aplicado por Thatcher (1979-1990) e Reagan (1981-1991)."},
{c:10, t:"“O imperador era juiz de si mesmo, pois acumulava o poder de resolver conflitos entre os demais poderes e não podia ser responsabilizado por seus atos.”",
 q:"A situação se refere ao:",
 a:["Poder Moderador da Constituição de 1824.","Poder Legislativo da Constituição de 1891.","Governo-Geral de 1548.","regime das capitanias hereditárias.","Poder Judiciário da Constituição de 1988."],
 e:"A Constituição de 1824, outorgada, criou quatro poderes (Executivo, Legislativo, Judiciário e Moderador). Na prática o parlamentarismo de D. Pedro II era “às avessas”."},
{c:10, q:"A política do “café com leite”, que vigorou na República até 1930, caracterizava-se por:",
 a:["alternância no poder entre as oligarquias paulista e mineira, sustentada por práticas como o voto de cabresto.","ampla participação popular e voto secreto garantido.","poder centralizado nas mãos de um imperador.","pluripartidarismo trabalhista e industrialização acelerada.","governo militar com atos autoritários."],
 e:"Em 1930 uma revolução levou Getúlio Vargas ao poder, que governou 15 anos, eliminou partidos e proibiu eleições, mas impulsionou a industrialização e o trabalhismo."},
/* ===================== CAP. 12 ===================== */
{c:12, t:"“A cultura é como teias de aranha: o ser humano está amarrado a teias de significados que ele mesmo teceu.”",
 q:"A concepção de cultura e o procedimento de investigação associados a essa imagem, no capítulo, são, respectivamente, de:",
 a:["Geertz, com a descrição densa.","Tylor, com a observação participante.","Morgan, com os estágios de evolução.","Boas, com o método de medida.","Malinowski, com o particularismo histórico."],
 e:"Para Geertz o antropólogo deve explicar e compreender de modo profundo, sem julgar, olhando pelo olhar do outro: uma “descrição densa”."},
{c:12, q:"Para Lewis Henry Morgan, as sociedades de agricultores, na evolução da cultura, correspondem ao estágio da:",
 a:["barbárie.","selvageria.","civilização.","anomia.","configuração."],
 e:"Selvageria = caçadores e coletores; barbárie = agricultura; civilização = sociedade urbanizada e com Estado. A cultura ocidental era vista no topo, hierarquização que Boas criticou."},
{c:12, t:"Um antropólogo passa dois anos vivendo em uma aldeia, aprendendo a língua local, participando das tarefas cotidianas e dos rituais, para compreender a vida do grupo de dentro.",
 q:"O método descrito, estabelecido por Malinowski, é a:",
 a:["observação participante.","pesquisa de opinião por questionário.","comparação por estágios evolutivos.","análise estatística de grandes populações.","experimentação laboratorial."],
 e:"A observação participante exige imersão na cultura: conviver, aprender a língua, os costumes e os rituais e participar o máximo possível da vida do grupo."},
{c:12, q:"A afirmação de que cada cultura possui valores e história únicos, não existindo uma única linha de desenvolvimento, é o princípio do:",
 a:["particularismo histórico, de Franz Boas.","evolucionismo, de Edward Tylor.","funcionalismo, de Karl Marx.","etnocentrismo, de Everardo Rocha.","positivismo, de Auguste Comte."],
 e:"O particularismo histórico, junto com o relativismo cultural, são os dois princípios de Boas, que também defendia que só existe uma raça humana, com grande diversidade."},
{c:12, t:"Ruth Benedict comparou povos como os zunhis e os kwakiutls para mostrar que cada grupo tem um conjunto de traços que forma seu caráter e sua identidade, e que a cultura funciona como uma lente pela qual as pessoas enxergam o mundo.",
 q:"O conceito central dessa escola (Cultura e Personalidade) é o de:",
 a:["ethos.","anomia.","habitus de classe.","branquitude.","poder legal."],
 e:"Ethos é o conjunto de traços que formam o caráter e a identidade de um grupo, diferenciando-o de outro. A crítica ao conceito é conceder pouca autonomia ao indivíduo."},
{c:12, q:"O capítulo observa que muitas manifestações da cultura popular, como o samba e a capoeira, antes de ganhar respeito:",
 a:["foram estigmatizadas e perseguidas, por serem criadas por pessoas pobres e negras, e depois incorporadas ao mercado e à indústria cultural.","sempre foram aceitas pelas elites como cultura erudita.","foram criadas pelas cortes europeias.","jamais foram apropriadas pelo mercado.","desapareceram após sua popularização."],
 e:"A cultura popular é espontânea e livre. Com o tempo, as manifestações são assimiladas pela indústria cultural, mas não perdem seu caráter popular."},
{c:12, t:"I. Um quadro de museu.\nII. O idioma falado por uma comunidade.\nIII. A estátua do Cristo Redentor.\nIV. O ofício das baianas de acarajé.",
 q:"São exemplos de cultura imaterial:",
 a:["II e IV.","I e III.","I e II.","III e IV.","Todos."],
 e:"Cultura material = bens físicos e palpáveis (quadro, escultura, monumentos). Imaterial = idioma, dança, comidas típicas, festas e saberes (o ofício das baianas é registrado como patrimônio imaterial)."},
{c:12, q:"A diferença entre empatia e alteridade, segundo Santos e Mestre, é que:",
 a:["a empatia é colocar-se na situação do outro em uma circunstância específica; a alteridade é reconhecer continuamente a diferença do outro e respeitar sua singularidade.","empatia e alteridade são sinônimos.","a alteridade é a crença de que o próprio grupo é o centro.","a empatia é a postura constante de respeito; a alteridade é pontual.","a alteridade só existe nas Ciências Naturais."],
 e:"A alteridade é um princípio fundamental do trabalho antropológico e vai além da empatia: reconhece que o outro é diferente de forma contínua."},
{c:12, t:"Os colonizadores portugueses consideravam os povos nativos sujeitos “sem alma”, que não conheciam as “verdades” e a quem cabia ensinar o modo “correto” de viver.",
 q:"A atitude dos colonizadores é um exemplo de:",
 a:["etnocentrismo, que julga o outro pelos valores do próprio grupo.","relativismo cultural, que não hierarquiza as culturas.","alteridade, que reconhece o outro.","estranhamento, que desnaturaliza o familiar.","observação participante, que exige imersão."],
 e:"O etnocentrismo toma o próprio grupo como centro. Pode levar a racismo, intolerância e violência. Para evitá-lo, usa-se o relativismo, a alteridade e o estranhamento."},
{c:12, t:"Uma pesquisadora pergunta por que, em nossa sociedade, o ideal de beleza feminino costuma ser alta, branca, magra e jovem, e descobre que esse padrão é recente, tendo sido criado na segunda metade do século XX.",
 q:"Ao colocar em dúvida um padrão tomado como natural, ela pratica:",
 a:["o estranhamento e a desnaturalização.","a observação participante.","o evolucionismo cultural.","o relativismo moral absoluto.","a classificação das culturas por estágios."],
 e:"Para DaMatta o antropólogo tem dupla tarefa: transformar o exótico em familiar e o familiar em exótico. O estranhamento serve para “desconfiar do que historicamente foi tomado como normal” (Bodart)."},
{c:12, q:"Em Orientalismo, Edward Said argumenta que:",
 a:["a noção de “Oriente” é uma invenção ocidental, que marca civilizações ricas e diversas com o selo do exotismo e da inferioridade.","o Oriente é uma região homogênea e superior ao Ocidente.","o Ocidente deve ensinar o Oriente a ser civilizado.","as civilizações são entidades fechadas e incomunicáveis.","a Antropologia sempre deu voz aos povos nativos."],
 e:"Said, Fanon e Spivak integram a crítica pós-colonial: apenas cientistas brancos ocidentais falavam sobre a cultura dos outros, com base em estereótipos."},
{c:12, q:"De acordo com Djamila Ribeiro, o conceito de lugar de fala implica reconhecer que:",
 a:["o lugar social molda experiências e perspectivas, sem determinar a consciência de cada um; é preciso dar voz a grupos silenciados.","apenas quem vive uma situação tem o direito de opinar sobre ela.","a posição social define por completo o que cada pessoa pensa.","as experiências são as mesmas em qualquer posição social.","a vivência individual é irrelevante para o conhecimento."],
 e:"O capítulo esclarece que quem não pertence ao grupo também pode opinar, mas é importante ouvir e aprender com quem teve sua fala silenciada por muito tempo."}
];

/* Questões discursivas (6,0 pontos cada, como na prova).
   crit = [pontos, critério]; kw = [rótulo, [variantes sem acento, em minúsculas]]  */
window.DISC = [
/* ---------- Cap. 01 ---------- */
{c:1, q:"A Revolução Industrial gerou reações dos trabalhadores. Diferencie ludismo e cartismo e explique por que esses movimentos surgiram.",
 r:"O ludismo foi um movimento de curta duração, reprimido pela polícia, em que os trabalhadores invadiam fábricas para destruir máquinas, por acreditarem que elas causavam o desemprego. O cartismo mobilizou os trabalhadores por direitos trabalhistas e políticos, como o sufrágio universal masculino e a representação no parlamento. Ambos surgiram da extrema exploração: salários reduzidos, jornadas de até 16 horas e trabalho de mulheres e crianças, após a passagem da manufatura para a maquinofatura.",
 crit:[[2,"Ludismo: destruição de máquinas (e repressão/curta duração)."],[2,"Cartismo: direitos trabalhistas e políticos (voto, representação)."],[2,"Causa: exploração decorrente da mecanização (salários baixos, jornada longa, precarização)."]],
 kw:[["ludismo / destruir máquinas",["ludismo","ludita","destru","quebr"]],["cartismo / direitos políticos",["cartismo","sufragio","voto","parlamento"]],["exploração / salários / jornada",["explora","salario","jornada","precariza"]],["maquinofatura / máquinas",["maquinofatura","maquina","mecaniza"]]]},
{c:1, q:"Quem foi Auguste Comte e por que é considerado o “pai da Sociologia”? Apresente os três estados de sua teoria.",
 r:"Auguste Comte foi o filósofo positivista que cunhou o termo “sociologia” e foi o primeiro a enunciar a necessidade de uma ciência da sociedade, com propostas de intervenção. Segundo ele, a humanidade passa por três estados: o teológico, em que a natureza é explicada por seres sobrenaturais, mitos e religiões; o metafísico, de teorias racionais sem observação da natureza; e o positivo, em que as explicações são buscadas na própria natureza, pelas ciências e pelo progresso.",
 crit:[[2,"Comte cunhou o termo/primeiro a propor uma ciência da sociedade."],[3,"Os três estados corretos (1,0 cada) com sua característica."],[1,"Relaciona ao positivismo, ciência e progresso."]],
 kw:[["Comte criou o termo / ciência da sociedade",["cunhou","termo","ciencia da sociedade","primeiro"]],["estado teológico",["teologic","sobrenatura","religio","mito"]],["estado metafísico",["metafisic","racional","sem observ"]],["estado positivo",["positiv","natureza","ciencia"]]]},
{c:1, q:"Explique a diferença entre as abordagens de Durkheim e de Weber sobre a origem da conduta dos indivíduos, citando um conceito de cada autor.",
 r:"Para Durkheim, a sociedade prevalece sobre o indivíduo: normas, costumes e leis são exteriores e coercitivos, formam a consciência coletiva e se impõem como fatos sociais. Para Weber, a conduta vem de dentro: o indivíduo atribui sentido ao que faz, e normas e costumes são internalizados; por isso o conceito central é a ação social, com quatro tipos (tradicional, afetiva, racional com relação a valores e a fins).",
 crit:[[2,"Durkheim: primazia da sociedade; exterioridade e coerção."],[2,"Weber: sentido atribuído pelo indivíduo; internalização."],[2,"Cita corretamente um conceito de cada autor (ex.: fato social e ação social)."]],
 kw:[["Durkheim: sociedade acima do indivíduo",["exterior","coerc","sociedade prevalece","acima"]],["fato social / consciência coletiva",["fato social","consciencia coletiva"]],["Weber: sentido / indivíduo",["sentido","individuo","internaliz","de dentro"]],["ação social",["acao social","tradicional","afetiva","racional"]]]},
{c:1, q:"Segundo Marx e Engels, como se dá a relação entre burguesia e proletariado, qual o papel do Estado nessa relação e que saída apontam para a exploração?",
 r:"Burgueses compram e proletários vendem a força de trabalho. Apesar de aparentar um contrato entre iguais, a relação é de antagonismo entre classes. O Estado, por meio de leis, tribunais e polícia, controla a luta de classes e evita o confronto aberto, mantendo a ordem. Para Marx e Engels, a transformação completa da exploração capitalista só viria com a revolução proletária.",
 crit:[[2,"Compra e venda da força de trabalho; antagonismo de classes."],[2,"Estado controla a luta de classes por leis, tribunais, polícia."],[2,"Revolução proletária como saída."]],
 kw:[["força de trabalho / compra e venda",["forca de trabalho","vende","compra"]],["antagonismo / luta de classes",["antagonismo","luta de classes","classes"]],["Estado controla o conflito",["estado","lei","policia","tribunais","ordem"]],["revolução proletária",["revolucao","proletari"]]]},
{c:1, q:"Apresente os três métodos básicos de investigação empírica da Sociologia e diga em que situação o método de casos recebe o nome de pesquisa etnográfica.",
 r:"O método experimental busca comprovar uma relação causal entre dois fatos e veio das ciências naturais. O método de medida observa, por perguntas diretas ou indiretas, populações amplas para análise quantitativa, e surgiu na Inglaterra do século XIX. O método de casos examina intensivamente uma unidade (pessoa, grupo, instituição, cultura). Quando a unidade é uma comunidade ou sociedade simples, chama-se estudo de campo ou pesquisa etnográfica.",
 crit:[[1.5,"Experimental: relação causal; origem nas ciências naturais."],[1.5,"Medida: populações amplas, análise quantitativa."],[1.5,"Casos: exame intensivo de uma unidade."],[1.5,"Etnográfica quando a unidade é uma comunidade ou sociedade simples."]],
 kw:[["experimental / relação causal",["experimental","causal"]],["medida / quantitativa / populações amplas",["medida","quantitativ","ampla"]],["casos / intensivo",["casos","intensiv","profund"]],["etnográfica / comunidade",["etnograf","campo","comunidade"]]]},
/* ---------- Cap. 02 ---------- */
{c:2, q:"Diferencie socialização formal e informal, citando um exemplo de cada uma, e explique por que a família é considerada o ponto de partida do processo.",
 r:"A socialização formal é imposta por instituições estruturadas, como a escola, a igreja e o Estado. A informal ocorre no cotidiano, na família, na vizinhança, entre amigos, no trabalho e pelos meios de comunicação. A família é o ponto de partida por ser o primeiro espaço de convívio, de afeto e de aprendizado das regras e da lida com as diferenças.",
 crit:[[2,"Formal: instituições (escola, igreja, Estado) com exemplo."],[2,"Informal: cotidiano (família, amigos, mídia, trabalho) com exemplo."],[2,"Família: primeiro espaço de convívio e afeto; aprende regras e lida com diferenças."]],
 kw:[["formal / instituições",["formal","instituic","escola","igreja","estado"]],["informal / cotidiano",["informal","amigos","vizinhan","midia","comunicacao"]],["família / primeiro convívio",["familia","primeiro","afeto","regras","diferenca"]]]},
{c:2, q:"O que Norbert Elias chama de configuração? Explique o conceito e dê um exemplo.",
 r:"Configuração é o conjunto de “eus”, “eles” e “nós” em relações de interdependência, que forma um fluxo contínuo que só se compreende no conjunto. Supera a separação entre indivíduo e sociedade, pois as características humanas só se desenvolvem nas relações. Exemplo: uma partida de futebol, com jogadores, torcidas, árbitros e regras; fora dela, o jogo não existe.",
 crit:[[2,"Definição: relações de interdependência entre “eus”, “eles” e “nós”."],[2,"Supera a divisão indivíduo × sociedade (sociedade dos indivíduos)."],[2,"Exemplo coerente (jogo de futebol ou outro)."]],
 kw:[["interdependência",["interdepend","relacoes","depend"]],["eus / nós / eles",["nos","eles","eu"]],["indivíduo e sociedade juntos",["individuo","sociedade","unidade"]],["exemplo do futebol",["futebol","jogo","partida","torcida","arbitro"]]]},
{c:2, q:"Explique o conceito de habitus, relacionando as contribuições de Elias e de Bourdieu.",
 r:"Para Elias, habitus é o saber social acumulado ao longo de toda uma vida em sociedade, transmitido de geração em geração e que muda lentamente. Bourdieu retoma o conceito com o mesmo objetivo, conectar indivíduos e sociedade: o habitus é social e individual, estruturado por instituições de socialização como família e escola, e liga-se ao lugar que cada pessoa ocupa numa sociedade desigual; orienta gostos, percepções e práticas.",
 crit:[[2,"Elias: saber social acumulado e transmitido entre gerações."],[2,"Bourdieu: social e individual; estruturado por instituições; ligado à posição social."],[2,"Relação: ambos conectam indivíduo e sociedade / orienta práticas e gostos."]],
 kw:[["saber social acumulado / gerações",["saber","acumulad","geracao","geracoes"]],["social e individual",["individual","social"]],["posição social / desigualdade",["posicao","lugar","desigual","classe"]],["instituições de socialização",["familia","escola","instituic"]]]},
{c:2, q:"Compare as leituras de Marx, Durkheim e Weber sobre o trabalho como instrumento de socialização.",
 r:"Para Marx, o trabalho gera divisão de classes e exploração: a mais-valia é o lucro tomado do trabalhador, e a alienação naturaliza esse processo. Para Durkheim, a divisão do trabalho produz solidariedade (mecânica e orgânica) e coesão social. Para Weber, o trabalho funciona como extensão da escola: impõe disciplina aos corpos e padrão de vida, e o Estado é a maior instituição de ajustamento de conduta.",
 crit:[[2,"Marx: exploração, mais-valia, alienação, antagonismo."],[2,"Durkheim: solidariedade mecânica/orgânica, coesão."],[2,"Weber: disciplina, extensão da escola, normas internalizadas."]],
 kw:[["Marx: exploração / mais-valia / alienação",["explora","mais-valia","mais valia","alienacao","antagonismo"]],["Durkheim: solidariedade / coesão",["solidariedade","coesao","organica","mecanica"]],["Weber: disciplina / extensão da escola",["disciplina","escola","internaliz","estado"]]]},
/* ---------- Cap. 07 ---------- */
{c:7, q:"Diferencie preconceito, discriminação e segregação, com um exemplo de cada.",
 r:"Preconceito é uma atitude negativa em relação a alguém por pertencer a um grupo (ideia, sentimento ou juízo prévio). Discriminação é o tratamento desigual, a ação concreta contra a pessoa (por exemplo, negar emprego por causa da cor). Segregação é a separação espacial ou institucional entre grupos (por exemplo, impor espaços distintos). As três podem estar ligadas, mas são conceitos diferentes.",
 crit:[[2,"Preconceito: atitude/ideia negativa por pertencer a um grupo."],[2,"Discriminação: tratamento desigual, em ação."],[2,"Segregação: separação espacial/institucional; exemplos coerentes."]],
 kw:[["preconceito / atitude negativa",["preconceito","atitude","ideia","sentimento"]],["discriminação / tratamento desigual",["discrimina","tratamento","desigual"]],["segregação / separação",["segrega","separa"]]]},
{c:7, q:"Defina racismo estrutural, segundo Silvio Almeida, e cite duas formas de manifestação.",
 r:"Racismo estrutural é a discriminação que resulta dos arranjos institucionais e das relações de poder na sociedade, mantendo vantagens (muitas vezes inconscientes) aos brancos, em razão da escravização, da colonização e de outros processos históricos. É um sistema invisível de regras, instituições e práticas. Manifesta-se, por exemplo, em disparidades no acesso a educação, saúde e oportunidades econômicas, na segregação por raça e na aplicação desigual das leis.",
 crit:[[2,"Definição: arranjos institucionais e relações de poder."],[2,"Vantagens muitas vezes inconscientes; herança da escravização e da colonização."],[2,"Duas manifestações corretas (1,0 cada)."]],
 kw:[["arranjos institucionais / relações de poder",["institucion","poder","arranjo"]],["inconsciente / invisível",["inconsciente","invisivel","acidental"]],["escravização / colonização",["escraviza","coloniza"]],["educação, saúde, oportunidades, leis",["educacao","saude","oportunidade","leis","segregacao","habita"]]]},
{c:7, q:"O que é interseccionalidade? Explique por que esse conceito ajuda a compreender os sistemas de opressão.",
 r:"Interseccionalidade é o conceito que descreve como diferentes aspectos da identidade de uma pessoa, como raça, classe e gênero, se cruzam e interagem, contribuindo para sistemas de opressão e dominação. Ela ajuda porque mostra que as várias formas de discriminação operam simultaneamente, produzindo formas mais intensas de exclusão, e que privilégio e discriminação atuam juntos na criação de hierarquias de poder.",
 crit:[[2,"Definição: cruzamento de raça, classe e gênero."],[2,"Opressões que operam simultaneamente e se reforçam."],[2,"Mostra hierarquias de poder e privilégio / perspectiva abrangente."]],
 kw:[["raça, classe e gênero",["raca","classe","genero"]],["simultâneas / cruzam",["simultane","cruz","interag","combin"]],["opressão / dominação / hierarquias",["opress","domina","hierarquia","privilegio"]]]},
{c:7, q:"Segundo o capítulo, qual a origem do racismo e quais fatores o mantêm? Cite também a posição de Munanga sobre o papel da educação.",
 r:"O racismo tem relação intrínseca com a escravização: construiu-se a ideia de inferioridade da pessoa negra para justificar o tráfico, a exploração e o poder econômico, e o estigma se consolidou ao longo dos séculos. O racismo se mantém por ignorância (falta de conhecimento sobre outras culturas) e pensamento de grupo. Para Munanga, a educação familiar e escolar contribui, mas não há fórmulas prontas, e é preciso admitir que a sociedade é racista.",
 crit:[[2,"Relação com a escravização/interesses econômicos."],[2,"Ignorância e pensamento de grupo."],[2,"Munanga: educação contribui, sem fórmulas prontas; admitir o racismo."]],
 kw:[["escravização / interesses econômicos",["escraviza","econom","explora"]],["ignorância / pensamento de grupo",["ignorancia","pensamento de grupo"]],["Munanga / educação / fórmulas",["munanga","educacao","formula","admitir"]]]},
/* ---------- Cap. 09 ---------- */
{c:9, q:"Compare o lugar do trabalho nas sociedades antigas, na Grécia e Roma e no feudalismo.",
 r:"Nas sociedades antigas, o trabalho não é uma esfera separada: a subsistência se mistura a rituais, mitos, festas e parentesco, com divisão por sexo e idade. Na Grécia e em Roma, a produção era garantida pela mão de obra escrava (tripallium), e os cidadãos valorizavam o ócio, dedicados à política. No feudalismo, servos e camponeses sustentavam o sistema; nas cidades havia corporações de ofício, com mestre, oficial e aprendiz.",
 crit:[[2,"Sociedades antigas: trabalho integrado a rituais, mitos, parentesco."],[2,"Grécia/Roma: escravidão e valorização do ócio."],[2,"Feudalismo: servos e corporações de ofício."]],
 kw:[["rituais / parentesco / integrado",["ritual","mito","parentesco","integrad"]],["escravidão / ócio",["escrav","ocio","cidadao"]],["servos / corporações de ofício",["servo","corporac","mestre","oficial","aprendiz"]]]},
{c:9, q:"Explique como Marx e Weber interpretam o trabalho no capitalismo.",
 r:"Para Marx, no capitalismo o trabalhador é dono apenas da força de trabalho, que vende ao proprietário; a produção gera mais-valia e o trabalhador, alienado, não se reconhece no que produz. Para Weber, a Reforma Protestante levou os calvinistas a exaltar o trabalho duro e a acumulação de riqueza como vocação, um chamado de Deus, o que foi fundamental para o espírito capitalista (A ética protestante e o espírito do capitalismo, 1905).",
 crit:[[3,"Marx: força de trabalho, mais-valia, alienação/exploração."],[3,"Weber: calvinismo, vocação, acumulação, espírito capitalista."]],
 kw:[["força de trabalho / mais-valia / alienação",["forca de trabalho","mais-valia","mais valia","alienacao","explora"]],["calvinismo / protestante",["calvin","protestante","reforma"]],["vocação / acumulação / espírito capitalista",["vocacao","acumula","espirito capitalista","riqueza"]]]},
{c:9, q:"Como Durkheim explica a divisão do trabalho e os conflitos do final do século XIX?",
 r:"Para Durkheim, a especialização do trabalho traz uma nova forma de solidariedade e não gera conflitos. Na solidariedade mecânica, típica de sociedades menos complexas, todos fazem quase tudo; na orgânica, há divisão do trabalho e interdependência das funções sociais. Os conflitos do período são questão moral, explicados pela anomia, a falta de instituições e normas integradoras; se existissem, a coesão social prevaleceria.",
 crit:[[2,"Divisão do trabalho gera solidariedade, não conflito."],[2,"Mecânica × orgânica corretamente distinguidas."],[2,"Conflitos = anomia (falta de normas/instituições)."]],
 kw:[["solidariedade mecânica",["mecanica"]],["solidariedade orgânica / interdependência",["organica","interdepend"]],["anomia",["anomia","falta de normas","normas"]],["coesão social",["coesao","integra"]]]},
{c:9, q:"Diferencie fordismo e toyotismo quanto à forma de produzir e ao perfil de trabalhador exigido.",
 r:"O fordismo, de Henry Ford (1914), usa a linha de montagem e o taylorismo para produzir em massa, com jornada de 8 horas, e controla rigidamente trabalhadores especializados em tarefas fixas. O toyotismo, do Japão dos anos 1970, é o just-in-time: produz conforme a demanda, reduz estoques e desperdícios, valoriza a qualidade total e organiza uma rede de fornecedores; exige trabalhadores flexíveis e polivalentes.",
 crit:[[1.5,"Fordismo: linha de montagem, produção e consumo em massa."],[1.5,"Fordismo: trabalhador especializado e controlado."],[1.5,"Toyotismo: just-in-time, conforme a demanda, sem estoques."],[1.5,"Toyotismo: trabalhador flexível/polivalente."]],
 kw:[["linha de montagem / produção em massa",["linha de montagem","massa","serie"]],["trabalhador especializado / controle",["especializ","controle","tarefa"]],["just-in-time / demanda",["just","demanda","estoque","tempo certo"]],["flexível / polivalente",["flexiv","polivalente","varias funcoes"]]]},
{c:9, q:"Explique os processos de precarização, pejotização e uberização do trabalho no Brasil atual.",
 r:"Nos últimos 40 anos, com a acumulação flexível, tornou-se regra a precarização do trabalho, devida a transformações tecnológicas, alterações nas regulações sociais e fragilização da organização dos trabalhadores. A pejotização é a exigência de que o trabalhador tenha CNPJ para prestar serviço, o que maquia a relação de trabalho e reduz direitos. A uberização, com empresas como Uber e iFood, faz o trabalhador arcar com seus meios (veículo), sem proteção, com jornadas muito longas.",
 crit:[[2,"Precarização e suas causas (tecnologia, regulações, fragilização dos sindicatos)."],[2,"Pejotização: CNPJ, perda de direitos."],[2,"Uberização: meios do trabalhador, sem proteção, jornada longa."]],
 kw:[["precarização",["precariza","precario"]],["pejotização / CNPJ",["pejotiza","cnpj"]],["uberização / aplicativo",["uberiza","aplicativo","uber","ifood","plataforma"]],["perda de direitos",["direitos","protecao","jornada"]]]},
/* ---------- Cap. 10 ---------- */
{c:10, q:"Apresente os três tipos de poder de Weber, com um exemplo de cada um.",
 r:"O poder legal funda-se na ordem jurídica e na burocracia (exemplo: a autoridade de um juiz). O poder tradicional baseia-se em costumes que passam de geração em geração (exemplo: a autoridade do patriarca ou do cacique). O poder carismático baseia-se no afeto e na admiração pelo líder, visto como dotado de qualidades heroicas ou sagradas (exemplo: um líder religioso ou político popular).",
 crit:[[2,"Legal: ordem jurídica/burocracia + exemplo."],[2,"Tradicional: costumes entre gerações + exemplo."],[2,"Carismático: afeto/dom do líder + exemplo."]],
 kw:[["legal / ordem jurídica",["legal","lei","juridic","burocra"]],["tradicional / costumes",["tradicional","costume","geracao","habito"]],["carismático / afeto / líder",["carisma","afeto","lider","heroi","sagrad"]]]},
{c:10, q:"Compare as ideias de Hobbes, Locke e Rousseau sobre o ser humano e o Estado.",
 r:"Para Hobbes, o ser humano é mau por natureza (“o homem é o lobo do homem”) e só um pacto social, que origina um Estado absolutista (Leviatã), freia a barbárie. Para Locke, em estado natural somos livres, e o Estado deve proteger a propriedade e as liberdades, com poder político democrático em um parlamento eleito. Para Rousseau, o ser humano nasce bom e é corrompido pela sociedade; a propriedade privada é o “pecado original”.",
 crit:[[2,"Hobbes: ser humano mau; contrato; Estado absolutista (Leviatã)."],[2,"Locke: liberdade e propriedade; Estado liberal e parlamento."],[2,"Rousseau: bom por natureza, corrompido pela sociedade/propriedade."]],
 kw:[["Hobbes: mau / Leviatã / absolutista",["hobbes","lobo","leviata","mau","absolut"]],["Locke: propriedade / liberdade",["locke","propriedade","liberdade","parlamento"]],["Rousseau: bom / corrompido",["rousseau","bom","corromp","pecado original"]]]},
{c:10, q:"Diferencie o Estado liberal, o de bem-estar social e o neoliberal quanto ao papel do Estado na economia.",
 r:"No Estado liberal (Adam Smith, Locke), o Estado não deve intervir na economia, aplicando o laissez-faire e protegendo a propriedade; a mão invisível regula o mercado. No Estado de bem-estar social (Keynes, após a crise de 1929), o Estado intervém, regula e gera empregos, garantindo saúde, educação e seguro-desemprego. No neoliberal (Hayek, Friedman, Thatcher, Reagan), o Estado deve ser mínimo, com privatizações e cortes de gastos sociais.",
 crit:[[2,"Liberal: laissez-faire, mão invisível, propriedade."],[2,"Bem-estar: Keynes, intervenção, serviços e emprego."],[2,"Neoliberal: Estado mínimo, privatização, corte de gastos sociais."]],
 kw:[["liberal: laissez-faire / mão invisível",["laissez","mao invisivel","adam smith","nao intervir","nao deve interv"]],["bem-estar: Keynes / intervenção",["keynes","interven","bem-estar","emprego"]],["neoliberal: mínimo / privatização",["neoliberal","minimo","privatiza","hayek","friedman","thatcher","reagan"]]]},
{c:10, q:"Apresente duas características comuns dos regimes totalitários e uma diferença entre a ideologia comunista e a fascista.",
 r:"Características comuns (duas): ideologia oficial; partido único dirigido por um ditador; terrorismo policial; monopólio dos meios de comunicação de massa e da luta armada; controle central da economia. Diferença: o comunismo pretende estatizar os meios de produção e construir uma sociedade sem classes, com base no proletariado; o fascismo mantém a propriedade privada, apoia-se em pequenos burgueses, banqueiros e industriais e defende a supremacia de uma raça ou nação.",
 crit:[[1.5,"Primeira característica comum correta."],[1.5,"Segunda característica comum correta."],[3,"Diferença comunismo × fascismo bem explicada."]],
 kw:[["partido único / ditador",["partido unico","ditador"]],["ideologia oficial / propaganda",["ideologia oficial","propaganda"]],["terror / monopólio",["terror","monopolio","controle"]],["comunismo: sem classes / estatiza",["sem classes","estatiz","proletari","comunis"]],["fascismo: raça / propriedade privada",["raca","nacao","propriedade privada","fascis","burgue"]]]},
{c:10, q:"Descreva a organização do poder no Império do Brasil e explique o que significou o “parlamentarismo às avessas”.",
 r:"Após a Independência (1822), o Brasil teve monarquia constitucional com executivo forte. A Constituição de 1824 criou quatro poderes: Executivo, Legislativo, Judiciário e Moderador, este exclusivo do imperador, que era juiz de si mesmo. O parlamentarismo de D. Pedro II foi “às avessas”: o imperador nomeava o primeiro-ministro e podia dissolver a Câmara, manipulando as maiorias e alternando conservadores e liberais.",
 crit:[[2,"Monarquia constitucional após 1822; Constituição de 1824."],[2,"Poder Moderador do imperador."],[2,"Parlamentarismo às avessas: imperador nomeava e dissolvia."]],
 kw:[["Constituição de 1824",["1824","outorgada","constituicao"]],["Poder Moderador",["moderador"]],["imperador nomeava / dissolvia",["nomeava","dissolver","dissolv","primeiro-ministro","as avessas"]]]},
/* ---------- Cap. 12 ---------- */
{c:12, q:"Como Geertz e Tylor entendem a cultura? Explique o que significa “descrição densa”.",
 r:"Para Tylor, cultura é “todo complexo” que inclui conhecimento, crença, arte, moral, lei, costume e outras capacidades e hábitos adquiridos pelo homem como membro da sociedade (primeira definição sistemática). Para Geertz, cultura é uma teia de significados em que o ser humano está amarrado e que ele mesmo produz. A descrição densa é a visão detalhada e profunda, que busca compreender a ação social sem julgar, olhando pelo olhar do outro.",
 crit:[[2,"Tylor: todo complexo, hábitos adquiridos como membro da sociedade."],[2,"Geertz: teia de significados."],[2,"Descrição densa: aprofundada, sem julgar, olhar do outro."]],
 kw:[["Tylor: todo complexo",["tylor","todo complexo","complexo","conhecimento","costume"]],["Geertz: teia de significados",["geertz","teia","significado"]],["descrição densa / sem julgar",["densa","profund","sem julgar","olhar do outro"]]]},
{c:12, q:"Explique a ideia central do evolucionismo cultural (Morgan e Tylor) e a crítica de Franz Boas por meio do particularismo histórico.",
 r:"O evolucionismo defendia que as culturas humanas caminham para uma direção comum, em estágios diferentes de desenvolvimento (Morgan: selvageria, barbárie e civilização), com a cultura ocidental no topo. Boas, com o particularismo histórico, sustenta que cada cultura tem valores e história únicos, sem linha única de desenvolvimento, e deve ser estudada em seus próprios termos, o que está na base do relativismo cultural.",
 crit:[[3,"Evolucionismo: direção comum, estágios (selvageria, barbárie, civilização), Ocidente no topo."],[3,"Boas: particularismo histórico; história única; sem linha única; relativismo."]],
 kw:[["direção comum / estágios",["direcao comum","estagio","mesma direcao"]],["selvageria, barbárie, civilização",["selvageria","barbarie","civilizacao"]],["particularismo histórico",["particularismo"]],["cada cultura é única / sem hierarquia",["unica","propri","relativismo","sem hierarquia","linha unica"]]]},
{c:12, q:"Diferencie alteridade, etnocentrismo e relativismo cultural, mostrando como se relacionam.",
 r:"A alteridade é a condição de ser o outro e o reconhecimento contínuo de que o outro é diferente, com respeito à sua singularidade. O etnocentrismo é a visão de mundo em que o próprio grupo é o centro e os outros são julgados pelos nossos valores, podendo levar ao racismo e à intolerância. O relativismo cultural, princípio de Boas, estabelece que não há hierarquia entre culturas. A alteridade e o relativismo são formas de evitar o etnocentrismo.",
 crit:[[2,"Alteridade: reconhecer o outro e sua diferença."],[2,"Etnocentrismo: próprio grupo como centro; julga pelos próprios valores."],[2,"Relativismo (sem hierarquia) e como os dois evitam o etnocentrismo."]],
 kw:[["alteridade / outro",["alteridade","outro","diferen"]],["etnocentrismo / próprio grupo",["etnocentrismo","proprio grupo","centro","valores"]],["relativismo / sem hierarquia",["relativ","hierarquia","boas"]]]},
{c:12, q:"O que é estranhamento, segundo Roberto DaMatta? Dê um exemplo de hábito cotidiano que pode ser desnaturalizado.",
 r:"Estranhamento é o esforço de olhar com estranheza o que é familiar e corriqueiro. Para DaMatta, o antropólogo tem a dupla tarefa de transformar o exótico em familiar e o familiar em exótico. Ele desnaturaliza hábitos que parecem naturais mas são construídos socialmente. Exemplos: escovar os dentes depois de cada refeição, tomar café na primeira refeição do dia ou o padrão de beleza.",
 crit:[[2,"Definição: olhar com estranheza o familiar."],[2,"Dupla tarefa de DaMatta / desnaturalização."],[2,"Exemplo coerente."]],
 kw:[["estranheza / familiar",["estranh","familiar","corriqueiro"]],["exótico em familiar (DaMatta)",["exotico","damatta","dupla tarefa"]],["desnaturalizar",["desnaturaliz","construid","natural"]],["exemplo: escovar dentes / café / beleza",["escovar","cafe","beleza","padrao"]]]},
{c:12, q:"Diferencie cultura popular de cultura erudita e dê um exemplo de cada.",
 r:"A cultura popular reúne saberes e práticas das camadas populares, em geral mais espontâneos e livres do que os regulados pelo mercado (exemplo: samba, capoeira, Carnaval, festas juninas), muitas vezes estigmatizados antes de serem reconhecidos. A cultura erudita é feita por e para a elite, por artistas muito especializados, em espaços seletivos como salas de concerto e museus (exemplo: música clássica), e funciona como distinção social (Elias, Bourdieu).",

/* ======================= FLASHCARDS ======================= */
const BOX_DAYS = [0, 0, 1, 3, 7, 14];
let CS = null, csCfg = { cap: 'all', mode: 'smart', rev: false };
function cartoes(cap) {
  if (cap && capById(cap)) csCfg.cap = capById(cap).id;
  cardsSetup();
}
function cardsSetup() {
  const pool = TERMS.filter(t => csCfg.cap === 'all' || t.c == csCfg.cap);
  const now = Date.now();
  const due = pool.filter(t => !S.cards[t.id] || S.cards[t.id].due <= now).length;
  const known = pool.filter(t => S.cards[t.id] && S.cards[t.id].box >= 3).length;
  app(`<div class="kicker">Flashcards</div><h2>Memorize os conceitos</h2>
  <p class="sub">Vire o cartão, avalie o quanto você sabia e o app reorganiza a revisão: o que você erra volta logo, o que você acerta volta depois.</p>
  <div class="card">
    <b>Capítulo</b>${capChips(csCfg.cap)}
    <p style="margin:14px 0 6px"><b>Modo</b></p>
    <div class="filters" id="modes">
      <button data-mode="smart" aria-pressed="${csCfg.mode === 'smart'}">Revisão inteligente (pendentes, até 25)</button>
      <button data-mode="all" aria-pressed="${csCfg.mode === 'all'}">Todos os cartões embaralhados</button>
    </div>
    <label class="row" style="margin-top:12px"><input type="checkbox" id="rev" ${csCfg.rev ? 'checked' : ''}> Modo inverso: mostrar a definição e adivinhar o termo</label>
    <p class="muted" style="margin:12px 0 0">${pool.length} cartões neste filtro · ${due} pendentes · ${known} dominados.</p>
    <button class="btn acc" id="go">Começar</button>
  </div>`);
  $$('[data-cap]').forEach(b => b.onclick = () => { csCfg.cap = b.dataset.cap === 'all' ? 'all' : +b.dataset.cap; cardsSetup(); });
  $$('[data-mode]').forEach(b => b.onclick = () => { csCfg.mode = b.dataset.mode; cardsSetup(); });
  $('#rev').onchange = e => { csCfg.rev = e.target.checked; };
  $('#go').onclick = startCards;
}
function startCards() {
  let pool = TERMS.filter(t => csCfg.cap === 'all' || t.c == csCfg.cap);
  if (csCfg.mode === 'smart') {
    const now = Date.now();
    pool = pool.filter(t => !S.cards[t.id] || S.cards[t.id].due <= now);
    if (!pool.length) { toast('Nenhum cartão pendente. Use "Todos os cartões" para revisar.'); return; }
    pool = shuffle(pool).slice(0, 25);
  } else pool = shuffle(pool);
  CS = { q: pool, i: 0, flip: false, n: { yes: 0, mid: 0, no: 0 }, again: {} };
  renderCard();
}
function renderCard() {
  const t = CS.q[CS.i];
  if (!t) return cardsEnd();
  const c = capById(t.c), rev = csCfg.rev;
  const front = rev ? `<div class="def">${t.d}</div>` : `<div class="big">${t.t}</div>`;
  const back = rev ? `<div class="big">${t.t}</div>` : `<div class="def">${t.d}</div>`;
  app(`<div class="row between"><span class="kicker" style="--c:${c.cor}">Cap. ${c.num}</span><span class="muted">${CS.i + 1} de ${CS.q.length}</span></div>
  <div class="bar" style="margin:6px 0"><i style="width:${CS.i / CS.q.length * 100}%"></i></div>
  <div class="fc" style="--c:${c.cor}"><button class="face" id="face" aria-live="polite">
    <span class="lab">${CS.flip ? (rev ? 'Termo' : 'Definição') : (rev ? 'Definição' : 'Termo')}</span>
    ${CS.flip ? back : front}
    <span class="hint">${CS.flip ? '' : 'Clique (ou Espaço) para virar'}</span></button></div>
  ${CS.flip ? `<div class="rate"><button class="no" data-r="no">Não sei (1)</button><button class="mid" data-r="mid">Quase (2)</button><button class="yes" data-r="yes">Sei (3)</button></div>` : ''}
  <p class="muted" style="text-align:center;margin-top:14px"><a href="#/cartoes">Encerrar sessão</a></p>`);
  $('#face').onclick = () => { if (!CS.flip) { CS.flip = true; renderCard(); } };
  $$('[data-r]').forEach(b => b.onclick = () => rate(b.dataset.r));
  kb = e => {
    if (!CS.flip && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); CS.flip = true; renderCard(); }
    else if (CS.flip) { const m = { '1': 'no', '2': 'mid', '3': 'yes' }[e.key]; if (m) rate(m); }
  };
}
function rate(r) {
  const t = CS.q[CS.i], s = S.cards[t.id] || { box: 1, due: 0 };
  if (r === 'yes') s.box = Math.min(5, s.box + 1); else if (r === 'no') s.box = 1; else s.box = Math.max(1, s.box);
  s.due = Date.now() + BOX_DAYS[s.box] * 86400000 + (r === 'yes' ? 3600000 : 0);
  S.cards[t.id] = s; CS.n[r]++;
  if (r === 'no' && !CS.again[t.id]) { CS.again[t.id] = true; CS.q.push(t); }
  save(); CS.i++; CS.flip = false; refreshTotal(); renderCard();
}
function cardsEnd() {
  kb = null;
  const n = CS.n;
  app(`<div class="kicker">Sessão concluída</div><h2>Bom trabalho!</h2>
  <div class="card"><div class="stat"><div><b>${n.yes}</b>Sabia</div><div><b>${n.mid}</b>Quase</div><div><b>${n.no}</b>Não sabia</div></div>

  <button class="btn acc" id="again">Nova sessão</button><a class="btn ghost" href="#/questoes">Ir para as questões</a></div>`);
  $('#again').onclick = cardsSetup;
}

let QS = null, qCfg = { cap: 'all', n: 10, only: false };
function questoes(cap) {

function quizSetup() {
  const pool = QUIZ.filter(q => qCfg.cap === 'all' || q.c == qCfg.cap);

  app(`<div class="kicker">Questões objetivas</div><h2>Treine no estilo da prova</h2>

  $$('[data-cap]').forEach(b => b.onclick = () => { qCfg.cap = b.dataset.cap === 'all' ? 'all' : +b.dataset.cap; quizSetup(); });
  $$('[data-n]').forEach(b => b.onclick = () => { qCfg.n = +b.dataset.n; quizSetup(); });
  $('#only').onchange = e => { qCfg.only = e.target.checked; quizSetup(); };
  $('#go').onclick = () => {
    let list = pool.slice();
    if (qCfg.only) list = list.filter(q => !(S.q[q.id] && S.q[q.id].ok));

}
function mkOpts(q) { q._o = shuffle(q.a.map((t, i) => ({ t, ok: i === 0 }))); }
function startQuiz(list) { list.forEach(mkOpts); QS = { list, i: 0, res: [], done: false }; renderQuiz(); }
function qBody(q) {
  return `${q.t ? `<div class="qtext">${esc(q.t)}</div>` : ''}<p class="qenun">${q.q}</p><div class="alts">${q._o.map((o, i) => `<button class="alt" data-i="${i}"><span class="l">${LET[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
}
function renderQuiz() {

  const c = capById(q.c); QS.done = false;
  app(`<div style="--c:${c.cor}"><div class="qhead"><span class="kicker">Cap. ${c.num} · ${c.titulo}</span><span class="muted">Questão ${QS.i + 1} de ${QS.list.length}</span></div>
  <div class="bar" style="margin-bottom:12px"><i style="width:${QS.i / QS.list.length * 100}%"></i></div>

function answer(i) {

}
function quizEnd() {

/* ======================= JOGOS ======================= */
let G = null;
function jogos(id) {

  if (g) return gameStart(g);
  app(`<div class="kicker">Jogos</div><h2>Classifique e fixe</h2>

  <div class="grid">${GAMES.map(g => { const c = capById(g.cap), b = S.games[g.id]; return `<a class="card capcard" href="#/jogos/${g.id}" style="--c:${c.cor}"><span class="num">CAP. ${c.num}</span><h3>${g.titulo}</h3><span class="muted" style="font-size:14px">${g.items.length} itens · ${g.cats.length} categorias</span>${b ? `<span class="chip ok">Melhor: ${b.best}/${b.total}</span>` : ''}</a>`; }).join('')}</div>`);
}
function gameStart(g) { G = { g, items: shuffle(g.items), i: 0, ok: 0, miss: [], done: false }; gameRender(); }

  G.done = false;
  app(`<div style="--c:${c.cor}"><p><a href="#/jogos">← Jogos</a></p><div class="kicker">${g.titulo}</div>
  <div class="row between"><span class="muted">${g.instr}</span><span class="muted">${G.i + 1} de ${G.items.length} · ${G.ok} acertos</span></div>
  <div class="bar" style="margin:6px 0 14px"><i style="width:${G.i / G.items.length * 100}%"></i></div>
  <div class="gcard">${it[0]}</div>

  $$('[data-k]').forEach(b => b.onclick = () => gameAnswer(+b.dataset.k));
  kb = e => { const n = parseInt(e.key); if (!G.done && n >= 1 && n <= g.cats.length) gameAnswer(n - 1); else if (G.done && e.key === 'Enter') { G.i++; gameRender(); } };
}
function gameAnswer(k) {
